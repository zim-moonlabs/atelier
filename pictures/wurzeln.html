<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wurzeln</title>
<style>
  :root { --bg: #f4efe6; --ink: 40, 34, 28; --accent: 176, 92, 52; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14120f; --ink: 232, 224, 210; --accent: 230, 150, 100; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  p { position: fixed; bottom: 12px; left: 16px; margin: 0;
      font: 13px/1.4 Georgia, serif; color: rgb(var(--ink)); opacity: .45; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<p>Klick: neuer Baum. Jeder wächst aus einem anderen Samen.</p>
<script>
// Ein Baum wächst nach oben, seine Wurzeln spiegeln ihn nach unten.
// Was man sieht, und was man nicht sieht, gleich viel.
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
const INK = dark ? '232, 224, 210' : '40, 34, 28';
const ACC = dark ? '230, 150, 100' : '176, 92, 52';
document.body.style.background = dark ? '#14120f' : '#f4efe6';
let branches, seed;

function rng() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

function start() {
  const dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  seed = Math.floor(Math.random() * 2147483646) + 1;
  const x = innerWidth / 2, y = innerHeight * 0.58;
  const len = Math.min(innerWidth, innerHeight) * 0.11;
  branches = [
    { x, y, a: -Math.PI / 2, len, w: 9, depth: 0, dir: -1 },
    { x, y, a:  Math.PI / 2, len: len * 0.8, w: 7, depth: 0, dir: 1 },
  ];
  // Horizont
  ctx.strokeStyle = `rgba(${INK}, .18)`; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(innerWidth, y); ctx.stroke();
}

function step() {
  const next = [];
  for (const b of branches.splice(0, 6)) {
    const segs = 8;
    let { x, y, a } = b;
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let i = 0; i < segs; i++) {
      a += (rng() - 0.5) * 0.25;
      x += Math.cos(a) * b.len / segs; y += Math.sin(a) * b.len / segs;
      ctx.lineTo(x, y);
    }
    const root = b.dir === 1;
    ctx.strokeStyle = `rgba(${INK}, ${root ? 0.35 : 0.85})`;
    ctx.lineWidth = Math.max(b.w, 0.4); ctx.lineCap = 'round';
    ctx.stroke();

    if (b.depth < 9 && b.len > 3) {
      const kids = rng() < 0.25 ? 3 : 2;
      for (let k = 0; k < kids; k++) {
        next.push({ x, y, a: a + (rng() - 0.5) * 1.3, len: b.len * (0.68 + rng() * 0.12),
                    w: b.w * 0.7, depth: b.depth + 1, dir: b.dir });
      }
    } else if (!root && rng() < 0.5) {
      ctx.fillStyle = `rgba(${ACC}, ${0.35 + rng() * 0.4})`;
      ctx.beginPath(); ctx.arc(x, y, 1.5 + rng() * 3, 0, Math.PI * 2); ctx.fill();
    }
  }
  branches.push(...next);
  if (branches.length) requestAnimationFrame(step);
}

c.addEventListener('click', () => { start(); step(); });
addEventListener('resize', () => { start(); step(); });
if (self !== top) document.querySelector("p").remove();
start(); step();
</script>
</body>
</html>
