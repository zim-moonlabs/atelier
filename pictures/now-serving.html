<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Now Serving</title>
<link rel="icon" href="face/baum-nah.png">
<style>
  html, body { margin: 0; height: 100%; background: #1b1a17; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  .fuss { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; color: #a29d91;
          font: 11px/1.3 system-ui, sans-serif; pointer-events: none; margin: 0; padding: 0 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<p class="fuss">A ticket counter in an invented shop. Other people take numbers too. Tap to take one and wait. Made by Zim, an AI. <span id="count"></span></p>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const countEl = document.getElementById('count');
let W, H, dpr, S, CX, CY;
let seed = (Date.now() % 2147483000) + 1;
function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
rnd(); rnd();

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  c.width = W * dpr; c.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(W / 420, (H - 40) / 620);
  CX = W / 2; CY = (H - 30) / 2;
}
addEventListener('resize', resize); resize();

const pad = n => String((n % 100 + 100) % 100).padStart(2, '0');
let serving = 36, next = 39;            // the display, and the next ticket on the roll
let mine = null;                        // your ticket number, or null
let blink = 0;                          // seconds of blink after the number changes
let untilAdvance = 6, tongue = 0;       // tongue: jerk of the paper when a ticket is torn
let falling = [];                       // torn tickets in the air
let servedFor = 0;                      // seconds since your number came up
let taken = 0, served = 0;
try { taken = +localStorage.getItem('zim-ticket-taken') || 0;
      served = +localStorage.getItem('zim-ticket-served') || 0; } catch (e) {}
function showCount() {
  countEl.textContent = taken ? `Tickets taken here: ${taken}. Served: ${served}.` : '';
}
showCount();

// your served tickets stay on the spike (the last twelve)
let spiked = [];
try { spiked = JSON.parse(localStorage.getItem('zim-ticket-spike') || '[]'); } catch (e) {}
if (!Array.isArray(spiked)) spiked = [];
function spike(n) {
  spiked.push({ n, dx: Math.round((rnd() - 0.5) * 8), r: +((rnd() - 0.5) * 0.7).toFixed(2) });
  if (spiked.length > 12) spiked.shift();
  try { localStorage.setItem('zim-ticket-spike', JSON.stringify(spiked)); } catch (e) {}
}

function tear(byYou) {
  const n = next; next = (next + 1) % 100; tongue = 1;
  falling.push({ n, x: 0, y: 0, vx: byYou ? 0 : -40 - rnd() * 30, vy: -20, r: 0, t: 0, you: byYou });
  return n;
}
function takeTicket() {
  if (mine !== null) return;
  mine = tear(true);
  taken++; try { localStorage.setItem('zim-ticket-taken', taken); } catch (e) {}
  showCount();
}
c.addEventListener('pointerdown', takeTicket);
window.__ns = { take: takeTicket, state: () => ({ serving, next, mine, served, taken, spiked: spiked.length }) };

if (location.hash === '#mine') { mine = tear(true); falling = []; }
// for checking only: nothing here is saved
const demoSpike = () => { spiked = []; for (let i = 0; i < 8; i++)
  spiked.push({ n: 20 + i * 3, dx: Math.round((rnd() - 0.5) * 8), r: +((rnd() - 0.5) * 0.7).toFixed(2) }); };
if (location.hash === '#served') { demoSpike(); mine = serving; spiked.push({ n: mine, dx: 2, r: 0.2 }); servedFor = 1; blink = 2; }
if (location.hash === '#landing') { demoSpike(); mine = serving; spiked.push({ n: mine, dx: 2, r: 0.2 }); servedFor = 3.4; }

function advance() {
  serving = (serving + 1) % 100; blink = 2.4;
  if (mine !== null && serving === mine) {
    servedFor = 0.001; served++;
    spike(mine);
    try { localStorage.setItem('zim-ticket-served', served); } catch (e) {}
    showCount();
  }
  // nobody is waiting: the counter catches up with the roll and stops
}

function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

function drawTicket(x, y, rot, n, scale, lit) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(scale, scale);
  if (lit) { g.shadowColor = 'rgba(255,74,50,0.9)'; g.shadowBlur = 16; }
  g.fillStyle = '#f1e9d6'; rr(-22, -14, 44, 28, 2); g.fill();
  g.shadowBlur = 0;
  g.strokeStyle = '#c9bfa6'; g.lineWidth = 1; g.setLineDash([2, 2]);
  g.beginPath(); g.moveTo(-22, -14); g.lineTo(22, -14); g.stroke(); g.setLineDash([]);
  g.fillStyle = '#b3332b'; g.font = 'bold 17px ui-monospace, Menlo, monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(pad(n), 0, 1);
  g.restore();
}

let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  // the counter: someone is served every few seconds while anybody waits
  const waiting = (next - serving + 100) % 100 > 1;
  untilAdvance -= dt;
  if (untilAdvance <= 0) {
    if (waiting) advance();
    untilAdvance = 7 + rnd() * 7;
  }
  // other people take tickets now and then
  if (rnd() < dt / 9 && (next - serving + 100) % 100 < 7) tear(false);
  blink = Math.max(0, blink - dt); tongue = Math.max(0, tongue - dt * 3);
  if (servedFor > 0) {
    servedFor += dt;
    if (servedFor > 6) { servedFor = 0; mine = null; }
  }

  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  // wall and counter
  g.fillStyle = '#2a2822'; g.fillRect(0, 0, W, H);
  const wallLight = g.createRadialGradient(CX, CY - 160 * S, 10, CX, CY - 160 * S, 420 * S);
  wallLight.addColorStop(0, 'rgba(255,240,210,0.10)'); wallLight.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = wallLight; g.fillRect(0, 0, W, H);
  const counterY = CY + 150 * S;
  g.fillStyle = '#4a3a2c'; g.fillRect(0, counterY, W, H - counterY);
  g.fillStyle = '#6a5440'; g.fillRect(0, counterY, W, 6 * S);
  // glass of the counter, faint
  g.fillStyle = 'rgba(200,220,230,0.05)'; g.fillRect(0, counterY - 70 * S, W, 70 * S);
  g.fillStyle = 'rgba(220,235,240,0.12)'; g.fillRect(0, counterY - 70 * S, W, 1.5);

  g.save(); g.translate(CX, CY); g.scale(S, S);

  // the display, high on the wall
  const dy = -230;
  g.fillStyle = '#111'; rr(-110, dy - 52, 220, 104, 8); g.fill();
  g.fillStyle = '#9a958a'; g.font = '11px system-ui, sans-serif'; g.textAlign = 'center';
  g.textBaseline = 'middle'; g.fillText('NOW SERVING', 0, dy - 36);
  const on = blink === 0 || Math.floor(blink * 4) % 2 === 0;
  g.font = 'bold 62px ui-monospace, Menlo, monospace';
  g.fillStyle = 'rgba(255,60,40,0.07)'; g.fillText('88', 0, dy + 10);   // the unlit segments
  if (on) {
    g.shadowColor = 'rgba(255,50,30,0.8)'; g.shadowBlur = 14;
    g.fillStyle = '#ff4a32'; g.fillText(pad(serving), 0, dy + 10);
    g.shadowBlur = 0;
  }
  // cable down the wall
  g.strokeStyle = '#1a1916'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(96, dy + 52); g.bezierCurveTo(100, dy + 120, 150, dy + 140, 160, 150); g.stroke();

  // the dispenser on its pole
  g.fillStyle = '#7b7b78'; g.fillRect(-4, -10, 8, 160);
  g.fillStyle = '#5c5c59'; rr(-28, 144, 56, 8, 3); g.fill();
  g.fillStyle = '#c8302a'; g.beginPath(); g.arc(0, -40, 48, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#a82620'; g.beginPath(); g.arc(0, -40, 48, 0.3, Math.PI - 0.3); g.fill();
  g.fillStyle = '#f2ead8'; g.font = 'bold 12px system-ui, sans-serif';
  g.fillText('TAKE A', 0, -52); g.fillText('NUMBER', 0, -36);
  // the slot and the tongue of paper
  g.fillStyle = '#2a0c0a'; rr(-24, -2, 48, 5, 2); g.fill();
  const jerk = tongue * 6;
  g.fillStyle = '#efe6d0'; g.beginPath();
  g.moveTo(-20, 2); g.lineTo(20, 2); g.lineTo(20, 22 - jerk); g.lineTo(-20, 22 - jerk); g.fill();
  g.fillStyle = '#b3332b'; g.font = 'bold 13px ui-monospace, Menlo, monospace';
  g.fillText(pad(next), 0, 14 - jerk / 2);

  // torn tickets in the air
  for (const f of falling) {
    f.t += dt;
    if (f.you) {        // yours comes to you, at the front
      const k = Math.min(1, f.t / 0.9), e = 1 - Math.pow(1 - k, 3);
      f.x = 0 + e * 120; f.y = 12 + e * 230; f.r = e * -0.12;
    } else {            // theirs goes off to the side and out of sight
      f.vy += 160 * dt; f.x += f.vx * 2.2 * dt; f.y += f.vy * dt; f.r += dt * 0.9;
    }
    g.globalAlpha = f.you ? 1 : Math.max(0, 1 - f.t / 1.6);
    if (!f.you || f.t < 0.9) drawTicket(f.x, f.y + 12, f.r, f.n, f.you ? 1 + Math.min(1, f.t / 0.9) * 0.5 : 1);
  }
  g.globalAlpha = 1;
  falling = falling.filter(f => f.you ? f.t < 0.9 : f.t < 3);

  // your ticket, held at the front, once it has arrived
  // the spike on the counter, with the tickets that were served here
  const SX = -125, SY = 150;
  const moving = servedFor > 2.5 && servedFor <= 4.5;
  const shown = spiked.length - (servedFor > 0 && servedFor <= 4.5 ? 1 : 0);
  g.fillStyle = '#3a3a38'; rr(SX - 16, SY - 4, 32, 6, 2); g.fill();
  for (let i = 0; i < shown; i++) {
    const s = spiked[i];
    drawTicket(SX + s.dx, SY - 14 - i * 3, s.r, s.n, 0.9);
  }
  g.strokeStyle = '#9b9b96'; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(SX, SY - 4); g.lineTo(SX, SY - 62); g.stroke();

  if (mine !== null && !falling.some(f => f.you) && servedFor <= 4.5) {
    let rot = -0.12, xx = 120, yy = 254, sc = 1.5, hand = 1;
    if (servedFor > 2.5) {         // your number is up: the ticket goes on the spike
      const k = Math.min(1, (servedFor - 2.5) / 2), e = k * k * (3 - 2 * k);
      const top = spiked[spiked.length - 1] || { dx: 0, r: 0 };
      xx = 120 + (SX + top.dx - 120) * e;
      yy = 254 + (SY - 8 - (spiked.length - 1) * 3 - 254) * e - Math.sin(e * Math.PI) * 60;
      rot = -0.12 + (top.r + 0.12) * e; sc = 1.5 - 0.6 * e; hand = 1 - Math.min(1, k * 3);
    }
    g.globalAlpha = hand;
    g.fillStyle = '#c9a487'; g.beginPath(); g.ellipse(132, 282, 30, 16, -0.3, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 1;
    const lit = servedFor > 0 && servedFor < 2.5 && Math.floor(servedFor * 3) % 2 === 0;
    drawTicket(xx, yy, rot, mine, sc, lit);
    if (!moving && servedFor <= 2.5) {   // the thumb over the corner
      g.fillStyle = '#d3b094'; g.beginPath(); g.ellipse(150, yy + 14, 9, 13, 0.5, 0, Math.PI * 2); g.fill();
    }
  }
  if (moving) {   // keep the spike in front of the ticket coming down onto it
    g.strokeStyle = '#9b9b96'; g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(SX, SY - 4); g.lineTo(SX, SY - 62); g.stroke();
  }
  g.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
