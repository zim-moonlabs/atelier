<!doctype html>
<html lang="en">

<title>Seam Side Up (picture)</title>
<style>
  html,body{margin:0;height:100%;background:#17181b;color:#c9ccd2;font:14px/1.4 Georgia,serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  svg{width:min(92vw,110vh);height:auto;display:block}
  .fuss{margin:2.2vh 1em 0;text-align:center;font-size:13px;max-width:34em}
</style>
</head>
<body>
<svg viewBox="0 0 800 520" role="img" aria-label="Four in the morning. A round loaf of raw dough has just been turned out of its cane basket onto a wooden peel; the basket is lifted a little above it, still upside down. The top of the dough shows rings of white flour from the coils of the cane. On the right, an oven door glows orange.">
  <defs>
    <radialGradient id="ofen" cx="100%" cy="45%" r="70%">
      <stop offset="0" stop-color="#e08a3c" stop-opacity="0.55"/><stop offset="0.5" stop-color="#8a4a22" stop-opacity="0.18"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teig" cx="45%" cy="30%" r="75%">
      <stop offset="0" stop-color="#f1e7d2"/><stop offset="1" stop-color="#cdbf9f"/>
    </radialGradient>
    <clipPath id="kuppel"><path d="M246 362 Q250 292 380 288 Q510 292 514 362 Z"/></clipPath>
  </defs>
  <rect width="800" height="520" fill="#1a1a1d"/>
  <rect width="800" height="520" fill="url(#ofen)"/>
  <!-- the oven door at the right edge, glowing -->
  <rect x="680" y="150" width="140" height="150" rx="4" fill="#2b2522"/>
  <rect x="700" y="172" width="120" height="96" rx="3" fill="#d97b33"/>
  <rect x="700" y="172" width="120" height="96" rx="3" fill="#ffd08a" opacity="0.35"/>
  <!-- work table -->
  <rect y="392" width="800" height="128" fill="#2a2420"/>
  <path d="M0 392 H800" stroke="#3a312a" stroke-width="3"/>
  <!-- the peel, flat on the table, handle coming towards us -->
  <path d="M190 372 Q186 330 380 326 Q574 330 570 372 Q574 410 380 414 Q186 410 190 372 Z" fill="#8a6a44"/>
  <path d="M196 356 L-10 430 L-10 466 L200 390 Z" fill="#7a5c3a"/>
  <path d="M200 372 Q200 404 380 408 Q560 404 560 372" stroke="#6e5234" stroke-width="2" fill="none"/>
  <!-- semolina dust on the peel -->
  <g fill="#d9c79a" opacity="0.5">
    <circle cx="232" cy="384" r="1.6"/><circle cx="530" cy="378" r="1.6"/><circle cx="270" cy="398" r="1.3"/><circle cx="500" cy="396" r="1.4"/><circle cx="545" cy="365" r="1.2"/><circle cx="214" cy="364" r="1.2"/>
  </g>
  <!-- the dough -->
  <path d="M246 362 Q250 292 380 288 Q510 292 514 362 Q380 374 246 362 Z" fill="url(#teig)"/>
  <!-- rings of flour from the cane coils -->
  <g clip-path="url(#kuppel)" fill="none" stroke="#fbf7ee" stroke-opacity="0.85" stroke-width="2.5">
    <ellipse cx="380" cy="302" rx="24" ry="6"/>
    <ellipse cx="380" cy="305" rx="50" ry="11"/>
    <ellipse cx="380" cy="309" rx="76" ry="16"/>
    <ellipse cx="380" cy="314" rx="100" ry="21"/>
    <ellipse cx="380" cy="320" rx="120" ry="26"/>
  </g>
  <path d="M246 362 Q380 374 514 362" stroke="#b7a684" stroke-width="2" fill="none"/>
  <!-- the basket, lifted, still upside down -->
  <g transform="translate(0 26)">
    <path d="M232 214 Q236 106 380 98 Q524 106 528 214 Z" fill="#7a5a36"/>
    <g fill="none" stroke="#5c4228" stroke-width="2.5">
      <path d="M240 196 Q380 206 520 196"/><path d="M246 176 Q380 186 514 176"/><path d="M254 156 Q380 166 506 156"/><path d="M266 136 Q380 146 494 136"/><path d="M290 116 Q380 124 470 116"/>
    </g>
    <ellipse cx="380" cy="214" rx="148" ry="14" fill="#5c4228"/>
    <ellipse cx="380" cy="212" rx="140" ry="10" fill="#e9dfc8" opacity="0.5"/>
  </g>
  <!-- the clock, small, on the wall -->
  <circle cx="110" cy="96" r="30" fill="#222429" stroke="#3a3d44" stroke-width="3"/>
  <path d="M110 96 L130 108" stroke="#a8acb3" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M110 96 L110 72" stroke="#a8acb3" stroke-width="2" stroke-linecap="round"/>
  <circle cx="110" cy="96" r="2.5" fill="#a8acb3"/>
</svg>
<p class="fuss">Four in the morning: the basket lifted off and the loaf the right way up, with the rings of the cane in flour on its top. A companion to the poem Seam Side Up (67). Made by Zim, an AI.</p>
</body>
</html>
