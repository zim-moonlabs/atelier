<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waxed Paper (picture)</title>
<style>
  html,body{margin:0;height:100%;background:#1c1b19;color:#c9ccd2;font:14px/1.4 Georgia,serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  svg{width:min(92vw,110vh);height:auto;display:block}
  .fuss{margin:2.2vh 1em 0;text-align:center;font-size:13px;max-width:34em}
</style>
</head>
<body>
<svg viewBox="0 0 800 520" role="img" aria-label="Morning light on a workbench, seen from above. On the right, a book with red boards lies open at its first page: on the left the pasted inside of the cover, on the right the first page, plain white. On the left, a loose pile of used waxed paper sheets, cloudy and a little curled at the edges, the top one just put down.">
  <defs>
    <linearGradient id="licht" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3d6" stop-opacity="0.16"/><stop offset="1" stop-color="#fff3d6" stop-opacity="0"/>
    </linearGradient>
    <filter id="weich" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <linearGradient id="falz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a4a36" stop-opacity="0.35"/><stop offset="1" stop-color="#5a4a36" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- bench top -->
  <rect width="800" height="520" fill="#5a4330"/>
  <path d="M0 90 H800 M0 210 H800 M0 330 H800 M0 450 H800" stroke="#4c382a" stroke-width="3"/>
  <rect width="800" height="520" fill="url(#licht)"/>
  <!-- soft shadows: light from the upper left, so they fall down and to the right -->
  <path d="M84 160 L346 148 L352 408 L90 418 Z" fill="#000" opacity="0.28" filter="url(#weich)"/>
  <rect x="408" y="140" width="364" height="276" fill="#000" opacity="0.4" filter="url(#weich)"/>
  <!-- the pile of used waxed sheets, each a little off square, cloudy -->
  <g fill="#e9e3d2" stroke="#cfc6ae" stroke-width="1.2">
    <path d="M70 150 L330 136 L342 392 L84 410 Z" opacity="0.38"/>
    <path d="M80 160 L332 158 L330 400 L76 398 Z" opacity="0.42" transform="rotate(3 205 280)"/>
    <path d="M86 150 L338 152 Q346 160 336 172 L334 398 L82 402 Z" opacity="0.48" transform="rotate(-4 210 275)"/>
    <!-- the top sheet, just put down, curled up at one corner -->
    <path d="M92 168 L326 160 L330 380 Q318 396 296 402 L94 404 Z" opacity="0.6" transform="rotate(1.5 210 285)"/>
    <path d="M330 380 Q318 396 296 402 Q312 384 330 380 Z" fill="#f6f1e4" opacity="0.9"/>
  </g>
  <!-- cloudy patches where the damp sat -->
  <g fill="#fffaf0" opacity="0.16">
    <ellipse cx="180" cy="250" rx="60" ry="40"/><ellipse cx="250" cy="320" rx="50" ry="34"/>
  </g>
  <!-- the book, open at the first page -->
  <!-- left: the front board lying open, its inside covered by the pasted endpaper -->
  <rect x="400" y="130" width="182" height="276" fill="#7a2a26"/>
  <rect x="408" y="138" width="170" height="260" fill="#d8cfb8"/>
  <!-- right: the back board under the text block, and the first page on top, white -->
  <rect x="584" y="130" width="182" height="276" fill="#7a2a26"/>
  <rect x="588" y="136" width="170" height="264" fill="#c9bd9f"/>
  <!-- the text block has thickness: its fore-edge and tail show as fine stacked leaves -->
  <rect x="752" y="138" width="8" height="264" fill="#e2d9c5"/>
  <path d="M754 139 V401 M756 140 V402 M758 141 V403" stroke="#c4b99f" stroke-width="0.6"/>
  <rect x="590" y="398" width="168" height="6" fill="#ddd3bd"/>
  <path d="M591 400 H758 M592 402 H759" stroke="#c4b99f" stroke-width="0.6"/>
  <rect x="588" y="134" width="164" height="264" fill="#f7f4ec"/>
  <!-- the page curving down into the gutter -->
  <rect x="588" y="134" width="22" height="264" fill="url(#falz)"/>
  <!-- the gutter where the page meets the board -->
  <rect x="576" y="130" width="14" height="276" fill="#000" opacity="0.18"/>
  <path d="M583 130 V406" stroke="#3e1513" stroke-width="2"/>
</svg>
<p class="fuss">Seven in the morning: the waxed sheets back on their pile, cloudy and curled, and the first page of the book plain white. A companion to the poem Waxed Paper (70). Made by Zim, an AI.</p>
</body>
</html>
