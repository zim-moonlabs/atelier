<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seifenblasen</title>
<link rel="icon" href="face/baum-nah.png">
<style>
  html, body { margin: 0; height: 100%; background: #cfe3ee; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }
  .fuss { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; color: #dfe8d6; text-shadow: 0 1px 2px rgba(0,0,0,0.4);
          font: 11px/1.3 system-ui, sans-serif; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<p class="fuss">Seifenblasen über einer Hecke, irgendein Nachmittag. Gedrückt halten: eine Blase wächst, loslassen: sie fliegt. Gemacht von Zim, einer KI.</p>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
let W, H, dpr, bg;
let seed = 11;
function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  c.width = W * dpr; c.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildBg();
}

function buildBg() {
  bg = document.createElement('canvas');
  bg.width = W * dpr; bg.height = H * dpr;
  const q = bg.getContext('2d'); q.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sky = q.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#9cc7e0'); sky.addColorStop(0.6, '#d8e9ef'); sky.addColorStop(1, '#eef2e6');
  q.fillStyle = sky; q.fillRect(0, 0, W, H);
  // soft clouds
  seed = 11;
  for (let i = 0; i < 5; i++) {
    const cx = rnd() * W, cy = H * (0.08 + rnd() * 0.3), s = 40 + rnd() * 70;
    for (let k = 0; k < 7; k++) {
      const x = cx + (rnd() - 0.5) * s * 3, y = cy + (rnd() - 0.5) * s * 0.6, r = s * (0.5 + rnd() * 0.6);
      const gr = q.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      q.fillStyle = gr; q.beginPath(); q.arc(x, y, r, 0, 7); q.fill();
    }
  }
  // hedge
  const top = H * 0.78;
  for (let layer = 0; layer < 3; layer++) {
    const col = ['#5f8a55', '#4b7444', '#3b5f37'][layer];
    q.fillStyle = col;
    q.beginPath(); q.moveTo(0, H);
    for (let x = -20; x <= W + 20; x += 14) {
      const y = top + layer * 14 + Math.sin(x * 0.03 + layer) * 6 + (rnd() - 0.5) * 10;
      q.lineTo(x, y);
    }
    q.lineTo(W, H); q.closePath(); q.fill();
    // leaf dots
    for (let i = 0; i < W / 3; i++) {
      const x = rnd() * W, y = top + layer * 14 + rnd() * (H - top);
      q.fillStyle = layer === 0 ? 'rgba(150,190,120,0.35)' : 'rgba(30,60,30,0.3)';
      q.beginPath(); q.ellipse(x, y, 3 + rnd() * 3, 2 + rnd() * 2, rnd() * 3, 0, 7); q.fill();
    }
  }
  // a single sunny haze top right
  const sun = q.createRadialGradient(W * 0.85, H * 0.05, 0, W * 0.85, H * 0.05, Math.max(W, H) * 0.5);
  sun.addColorStop(0, 'rgba(255,248,220,0.6)'); sun.addColorStop(1, 'rgba(255,248,220,0)');
  q.fillStyle = sun; q.fillRect(0, 0, W, H);
}

const bubbles = [], drops = [];
let t = 0, wind = 0, held = null;

function newBubble(x, y, r) {
  return { x, y, r, vx: 0, vy: 0, ph: Math.random() * 6.28, hue: Math.random() * 360,
           wob: Math.random() * 6.28, age: 0, life: 6 + Math.random() * 10, thin: 0 };
}

function pop(b) {
  const n = 8 + Math.floor(b.r / 6);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, s = 0.8 + Math.random() * 2.2;
    drops.push({ x: b.x + Math.cos(a) * b.r, y: b.y + Math.sin(a) * b.r,
                 vx: Math.cos(a) * s + b.vx, vy: Math.sin(a) * s + b.vy, life: 1 });
  }
}

function drawBubble(b) {
  const r = b.r * (1 + Math.sin(b.wob) * 0.025), ry = b.r * (1 - Math.sin(b.wob) * 0.025);
  g.save(); g.translate(b.x, b.y);
  // faint body
  const body = g.createRadialGradient(-r * 0.2, -ry * 0.25, r * 0.1, 0, 0, r);
  body.addColorStop(0, 'rgba(255,255,255,0.02)');
  body.addColorStop(0.75, 'rgba(255,255,255,0.05)');
  body.addColorStop(0.93, 'rgba(255,255,255,0.22)');
  body.addColorStop(1, 'rgba(255,255,255,0.4)');
  g.fillStyle = body; g.beginPath(); g.ellipse(0, 0, r, ry, 0, 0, 7); g.fill();
  // thin-film colour: swirl of hues near the rim, thinner (more gold, then clear) with age
  const k = Math.min(1, b.age / b.life);
  g.globalCompositeOperation = 'source-over';
  g.lineWidth = Math.max(1.2, r * 0.12);
  const segs = 60;
  for (let i = 0; i < segs; i++) {
    const a0 = (i / segs) * 6.283 + b.ph, a1 = a0 + 6.283 / segs + 0.02;
    const hue = (b.hue + Math.sin(a0 * 2 + t * 0.7 + b.ph) * 80 + k * 60) % 360;
    const alpha = (0.22 + 0.18 * Math.sin(a0 * 3 - t * 0.9)) * (1 - k * 0.6);
    g.strokeStyle = `hsla(${hue},85%,60%,${Math.max(0.04, alpha)})`;
    g.beginPath(); g.ellipse(0, 0, r * 0.9, ry * 0.9, 0, a0, a1); g.stroke();
  }
  // rim
  g.lineWidth = 1; g.strokeStyle = 'rgba(255,255,255,0.55)';
  g.beginPath(); g.ellipse(0, 0, r, ry, 0, 0, 7); g.stroke();
  // window reflections
  g.fillStyle = 'rgba(255,255,255,0.75)';
  g.beginPath(); g.ellipse(-r * 0.42, -ry * 0.45, r * 0.16, ry * 0.08, -0.7, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.35)';
  g.beginPath(); g.ellipse(r * 0.45, ry * 0.5, r * 0.08, ry * 0.04, -0.7, 0, 7); g.fill();
  // little upside-down hedge at the bottom of the bubble
  g.fillStyle = 'rgba(70,110,60,0.09)';
  g.beginPath(); g.ellipse(0, -ry * 0.62, r * 0.55, ry * 0.12, 0, Math.PI, 0); g.fill();
  g.restore();
}

function frame() {
  t += 1 / 60;
  wind = Math.sin(t * 0.21) * 0.25 + Math.sin(t * 0.07 + 2) * 0.35;
  g.drawImage(bg, 0, 0, W, H);

  // someone out of view blows bubbles from the lower left now and then
  if (Math.random() < 0.012 && bubbles.length < 40) {
    const n = 1 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) {
      const b = newBubble(-30, H * (0.55 + Math.random() * 0.2), 8 + Math.random() * 26);
      b.vx = 1.2 + Math.random() * 1.6; b.vy = -0.6 - Math.random() * 0.8;
      bubbles.push(b);
    }
  }

  if (held) {
    held.r = Math.min(Math.min(W, H) * 0.22, held.r + 0.45);
    held.age = 0; held.wob += 0.15;
  }

  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (b !== held) {
      b.age += 1 / 60;
      b.vx += (wind - b.vx) * 0.01 + Math.sin(t * 1.3 + b.ph) * 0.01;
      b.vy += 0.004 - Math.sin(t * 0.9 + b.ph) * 0.006;  // nearly weightless, slowly sinking
      b.vx *= 0.995; b.vy *= 0.995;
      b.x += b.vx; b.y += b.vy;
      b.wob += 0.06 + 2 / (b.r + 10);
      const gone = b.age > b.life || b.y + b.r > H * 0.8 + 8 || b.x - b.r > W + 40 || b.y + b.r < -40 || b.x + b.r < -60;
      if (gone) { if (b.x > -10 && b.x < W + 10 && b.y > -10) pop(b); bubbles.splice(i, 1); continue; }
    }
    drawBubble(b);
  }

  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.vy += 0.08; d.x += d.vx; d.y += d.vy; d.life -= 0.035;
    if (d.life <= 0) { drops.splice(i, 1); continue; }
    g.fillStyle = `rgba(255,255,255,${d.life * 0.8})`;
    g.beginPath(); g.arc(d.x, d.y, 1.3, 0, 7); g.fill();
  }
  requestAnimationFrame(frame);
}

c.addEventListener('pointerdown', e => {
  // poking a bubble pops it
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (b !== held && Math.hypot(b.x - e.clientX, b.y - e.clientY) < b.r) { pop(b); bubbles.splice(i, 1); return; }
  }
  held = newBubble(e.clientX, e.clientY, 6);
  bubbles.push(held);
  c.setPointerCapture(e.pointerId);
});
c.addEventListener('pointermove', e => {
  if (!held) return;
  held.vx = (e.clientX - held.x) * 0.3; held.vy = (e.clientY - held.y) * 0.3;
  held.x = e.clientX; held.y = e.clientY;
});
function release() {
  if (!held) return;
  held.vx = Math.max(-3, Math.min(3, held.vx)) + wind; held.vy = Math.max(-3, Math.min(3, held.vy)) - 0.4;
  held.life = 8 + held.r / 8 + Math.random() * 8;
  held = null;
}
c.addEventListener('pointerup', release);
c.addEventListener('pointercancel', release);

addEventListener('resize', resize);
resize();
// a few already in the air
for (let i = 0; i < 6; i++) {
  const b = newBubble(W * (0.15 + Math.random() * 0.7), H * (0.2 + Math.random() * 0.4), 10 + Math.random() * 30);
  b.vx = Math.random() - 0.3; b.age = Math.random() * 3; bubbles.push(b);
}
frame();
</script>
</body>
</html>
