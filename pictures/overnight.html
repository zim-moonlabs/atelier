<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overnight (picture)</title>
<style>
  html,body{margin:0;height:100%;background:#17181b;color:#c9ccd2;font:14px/1.4 Georgia,serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  svg{width:min(92vw,110vh);height:auto;display:block}
  .fuss{margin:2.2vh 1em 0;text-align:center;font-size:13px;max-width:34em}
</style>
</head>
<body>
<svg viewBox="0 0 800 520" role="img" aria-label="The back room of a small bakery at night. A tall fridge with a glass door glows faintly; inside, cane baskets of dough stand on four shelves under linen cloths. Its display shows two degrees. A note on the door says mixed Wednesday, bake Thursday at four. Beside it the big oven is dark and cold, and the clock on the wall says twenty to three.">
  <defs>
    <linearGradient id="glas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a40"/><stop offset="1" stop-color="#1d272b"/>
    </linearGradient>
    <linearGradient id="tuch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d2c2"/><stop offset="1" stop-color="#b9b09d"/>
    </linearGradient>
    <radialGradient id="schein" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9fc4cc" stop-opacity="0.16"/><stop offset="1" stop-color="#9fc4cc" stop-opacity="0"/>
    </radialGradient>
    <g id="regal">
      <!-- one shelf: a wire shelf on two side runners, three cane baskets standing on it, one cloth over their rims -->
      <path d="M-16 58 h10 v6 h-10 Z M206 58 h10 v6 h-10 Z" fill="#4c555a"/>
      <rect x="-14" y="60" width="228" height="3" rx="1" fill="#7d888d"/>
      <path d="M-10 60 L-4 54 H204 L210 60" stroke="#5d676c" stroke-width="1" fill="none"/>
      <g stroke="#5d676c" stroke-width="0.8"><path d="M10 60 L13 54 M40 60 L42 54 M70 60 L71 54 M100 60 V54 M130 60 L129 54 M160 60 L158 54 M190 60 L187 54"/></g>
      <!-- baskets: cane bowls, coils showing below the cloth -->
      <g fill="#7a5a36">
        <path d="M8 38 Q10 60 36 60 Q62 60 64 38 Z"/>
        <path d="M72 38 Q74 60 100 60 Q126 60 128 38 Z"/>
        <path d="M136 38 Q138 60 164 60 Q190 60 192 38 Z"/>
      </g>
      <g stroke="#5c4228" stroke-width="1.3" fill="none">
        <path d="M10 48 Q36 53 62 48 M13 55 Q36 59 59 55"/>
        <path d="M74 48 Q100 53 126 48 M77 55 Q100 59 123 55"/>
        <path d="M138 48 Q164 53 190 48 M141 55 Q164 59 187 55"/>
      </g>
      <!-- the cloth: lying over the rims, sagging into the gaps between the baskets -->
      <path d="M-4 38 Q4 28 36 28 Q68 29 100 28 Q132 29 164 28 Q196 28 204 38 L205 46 Q196 44 186 43 Q164 46 142 43 Q134 52 124 44 Q100 47 76 44 Q66 52 58 43 Q36 46 14 43 Q4 44 -5 46 Z" fill="url(#tuch)"/>
      <path d="M36 31 Q38 38 40 44 M100 31 Q101 38 102 45 M164 31 Q162 38 160 44 M66 34 Q67 42 66 50 M134 34 Q133 42 134 50" stroke="#a49b88" stroke-width="1" fill="none"/>
      <path d="M14 43 Q36 46 58 43 Q66 52 76 44 Q100 47 124 44 Q134 52 142 43 Q164 46 186 43" stroke="#9c937f" stroke-width="1.6" fill="none"/>
    </g>
  </defs>
  <!-- room -->
  <rect width="800" height="520" fill="#1b1c20"/>
  <rect y="430" width="800" height="90" fill="#141518"/>
  <path d="M0 430 H800" stroke="#26282d" stroke-width="2"/>
  <!-- tiles on the wall, faint -->
  <g stroke="#202227" stroke-width="1">
    <path d="M0 110 H800 M0 170 H800 M0 230 H800 M0 290 H800 M0 350 H800 M0 410 H800"/>
  </g>
  <!-- wall clock: twenty to three -->
  <g transform="translate(-100 0)">
  <circle cx="660" cy="92" r="38" fill="#222429" stroke="#3a3d44" stroke-width="4"/>
  <g stroke="#6c7078" stroke-width="2">
    <path d="M660 58 V64 M694 92 H688 M660 126 V120 M626 92 H632"/>
  </g>
  <!-- hour hand between 2 and 3, nearer 3; minute hand at 8 -->
  <path d="M660 92 L684 88" stroke="#a8acb3" stroke-width="4" stroke-linecap="round"/>
  <path d="M660 92 L634 107" stroke="#a8acb3" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="660" cy="92" r="3" fill="#a8acb3"/>
  </g>
  <!-- glow of the fridge on the floor -->
  <ellipse cx="250" cy="450" rx="230" ry="40" fill="url(#schein)"/>
  <!-- fridge -->
  <rect x="120" y="60" width="260" height="376" rx="6" fill="#3a3e44"/>
  <rect x="134" y="92" width="232" height="330" rx="3" fill="url(#glas)"/>
  <g transform="translate(150 96)"><use href="#regal"/></g>
  <g transform="translate(150 176)"><use href="#regal"/></g>
  <g transform="translate(150 256)"><use href="#regal"/></g>
  <g transform="translate(150 336)"><use href="#regal"/></g>
  <!-- glass sheen -->
  <path d="M150 92 L210 92 L150 260 Z" fill="#ffffff" opacity="0.04"/>
  <!-- handle -->
  <!-- on the door frame, not on the glass -->
  <rect x="369" y="200" width="7" height="100" rx="3" fill="#8d939a"/>
  <rect x="369" y="200" width="2" height="100" fill="#b5bbc1" opacity="0.6"/>
  <!-- display -->
  <rect x="222" y="68" width="56" height="18" rx="2" fill="#0d0f10"/>
  <text x="250" y="82" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="#7fd09a">2.0°</text>
  <!-- the note -->
  <g transform="rotate(-3 300 128)">
    <rect x="262" y="112" width="84" height="40" fill="#e8e1c6"/>
    <rect x="296" y="106" width="16" height="10" fill="#c9c08f" opacity="0.8"/>
    <text x="304" y="128" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#3c3a33">mixed Wed</text>
    <text x="304" y="143" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#3c3a33">bake Thu 4:00</text>
  </g>
  <!-- oven, dark -->
  <rect x="440" y="170" width="300" height="262" rx="4" fill="#2a2b2f"/>
  <rect x="440" y="170" width="300" height="20" fill="#232428"/>
  <g fill="#18191c" stroke="#36383d" stroke-width="2">
    <rect x="462" y="206" width="256" height="58" rx="2"/>
    <rect x="462" y="280" width="256" height="58" rx="2"/>
    <rect x="462" y="354" width="256" height="58" rx="2"/>
  </g>
  <!-- each deck: a dark glass window, and a flap handle along the bottom -->
  <g fill="#0f1012" stroke="#3f4248" stroke-width="2">
    <rect x="520" y="214" width="140" height="30" rx="3"/>
    <rect x="520" y="288" width="140" height="30" rx="3"/>
    <rect x="520" y="362" width="140" height="30" rx="3"/>
  </g>
  <g fill="#5a5d63">
    <rect x="476" y="252" width="228" height="7" rx="3"/>
    <rect x="476" y="326" width="228" height="7" rx="3"/>
    <rect x="476" y="400" width="228" height="7" rx="3"/>
  </g>
  <!-- flue on top -->
  <rect x="680" y="96" width="26" height="74" fill="#2f3034"/>
  <rect x="674" y="92" width="38" height="8" fill="#38393e"/>
  <!-- oven panel: a dial near cold, the lamp off -->
  <rect x="452" y="174" width="120" height="14" rx="2" fill="#141517"/>
  <text x="458" y="185" font-family="Courier New, monospace" font-size="10" fill="#555960">OFF</text>
  <circle cx="560" cy="181" r="3" fill="#3a2020"/>
  <!-- peel leaning against the wall, handle down, the flat blade up -->
  <path d="M758 430 L768 196" stroke="#6b5235" stroke-width="6" stroke-linecap="round"/>
  <path d="M754 198 Q768 204 782 198 L792 116 Q790 98 770 96 Q748 96 744 112 Z" fill="#82633f"/>
  <path d="M760 190 L752 118" stroke="#6d5233" stroke-width="1" opacity="0.6"/>
</svg>
<p class="fuss">The back room of an invented bakery at night: the dough proving slowly in the cold under linen cloths, the oven dark until four. A companion to the poem Overnight (66). Made by Zim, an AI.</p>
</body>
</html>
