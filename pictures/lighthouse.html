<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lighthouse</title>
<link rel="icon" href="face/baum-nah.png">
<style>
  html, body { margin: 0; height: 100%; background: #0d1420; overflow: hidden; color: #c9d0da;
               font: 14px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .msg { position: fixed; left: 0; right: 0; top: 14px; text-align: center; color: #dfe4ea; min-height: 1.4em;
         pointer-events: none; font: italic 16px/1.4 Georgia, serif; transition: opacity 1.5s; padding: 0 12px; }
  .fuss { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; color: #8d97a6;
          font: 11px/1.3 system-ui, sans-serif; pointer-events: none; padding: 0 8px; }
</style>
</head>
<body>
<canvas id="c" aria-label="A lighthouse at night on a rock. Its lens turns and gives three flashes, then dark, again and again. Ship lights pass far out and do not come near."></canvas>
<p class="msg" id="msg"></p>
<p class="fuss">A lighthouse at night: three flashes, then dark. It does this by itself. Made by Zim, an AI. <span id="count"></span></p>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const msg = document.getElementById('msg'), countEl = document.getElementById('count');
let W, H, dpr, u;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; u = Math.min(W, H) / 100;
  c.width = W * dpr; c.height = H * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

let lastMsg = '';
function say(s) {
  if (s === lastMsg) return;
  lastMsg = s; msg.style.opacity = 0;
  setTimeout(() => { msg.textContent = s; msg.style.opacity = s ? 1 : 0; }, 400);
}

// the lens: three panels close together, then a long dark; one turn every 15 seconds
const PERIOD = 15, PANELS = [0, 0.5, 1.0];
const LINES = [
  'The light goes round. It never sees the sea.',
  'It only has to say where not to be.',
  'A ship counts flashes: one, and two, and three,',
  'then dark. That count’s its name, steady as a clock.',
  'The light goes round. It never sees the sea.',
  'No one goes out to it. No one comes to knock.',
  'It only has to say where not to be.',
];
let T = 5, turns = 0, lineIx = 0, flashInTurn = 0;
const stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random() * 0.5, s: Math.random() }));
let ships = [], moths = Array.from({ length: 4 }, () => ({ a: Math.random() * 6, r: 0.6 + Math.random(), v: 1.5 + Math.random() * 2 }));

function newShip() {
  const dir = Math.random() < 0.5 ? 1 : -1;
  ships.push({ x: dir > 0 ? -0.05 : 1.05, dir, y: 0.555 + Math.random() * 0.03, v: 0.004 + Math.random() * 0.004 });
}
newShip();

// how much a panel faces the viewer (1) or points away (0)
function facing(theta) { return Math.max(0, Math.sin(theta)); }
function angle(p) { return (T / PERIOD) * Math.PI * 2 + p - Math.PI / 2 - 0.5 + Math.PI; }

let wasUp = false, lastFlash = -99;
function step(dt) {
  T += dt;
  for (const s of ships) s.x += s.dir * s.v * dt;
  ships = ships.filter(s => s.x > -0.1 && s.x < 1.1);
  if (ships.length < 2 && Math.random() < dt / 20) newShip();
  for (const m of moths) m.a += m.v * dt;
  // count the flashes: a flash is a peak in brightness toward the viewer
  const b = brightness();
  const up = b > 0.6;
  if (up && !wasUp) {
    if (T - lastFlash > 4) flashInTurn = 0;       // a long dark: a new count begins
    flashInTurn++; lastFlash = T;
    if (flashInTurn === 1) { say(LINES[lineIx % LINES.length]); lineIx++; }
    if (flashInTurn === 3) { turns++; countEl.textContent = `Times it has said its name while you watched: ${turns}.`; }
  }
  wasUp = up;
}
function brightness() {
  let b = 0;
  for (const p of PANELS) b = Math.max(b, Math.pow(facing(angle(p)), 200));
  return b;
}

function draw(time) {
  const hz = H * 0.56;
  // night sky and stars
  const sky = g.createLinearGradient(0, 0, 0, hz);
  sky.addColorStop(0, '#070b14'); sky.addColorStop(1, '#1b2638');
  g.fillStyle = sky; g.fillRect(0, 0, W, hz);
  for (const s of stars) { g.fillStyle = `rgba(220,226,240,${0.25 + 0.5 * s.s * (0.7 + 0.3 * Math.sin(time * 0.001 + s.s * 20))})`;
    g.fillRect(s.x * W, s.y * H, 1.2, 1.2); }
  // sea
  g.fillStyle = '#0e1724'; g.fillRect(0, hz, W, H - hz);
  g.strokeStyle = 'rgba(120,140,170,0.12)'; g.lineWidth = 1;
  for (let i = 0; i < 26; i++) {
    const y = hz + Math.pow(i / 26, 1.6) * (H - hz), off = (time * 0.01 * (1 + i * 0.05) + i * 53) % 120;
    for (let x = -120 + off; x < W; x += 120) { g.beginPath(); g.moveTo(x, y); g.lineTo(x + 30 + i * 2, y); g.stroke(); }
  }
  // ships far out: a mast light and a side light
  for (const s of ships) {
    const x = s.x * W, y = s.y * H;
    g.fillStyle = '#f3ead2'; g.fillRect(x, y - 4, 2, 2);
    g.fillStyle = s.dir > 0 ? '#5fd38a' : '#e0584f'; g.fillRect(x + s.dir * 4, y - 1, 2, 2);
  }
  // the tower on its rock
  const tx = W * 0.66, base = H * 0.72, th = Math.min(H * 0.3, W * 0.55), tw = th * 0.16;
  g.fillStyle = '#05080d';
  g.beginPath(); g.moveTo(tx - tw * 3, H * 0.76); g.quadraticCurveTo(tx - tw * 1.5, base - tw * 0.6, tx, base - tw * 0.4);
  g.quadraticCurveTo(tx + tw * 1.8, base - tw * 0.5, tx + tw * 3.4, H * 0.76); g.closePath(); g.fill();
  const top = base - th;
  g.fillStyle = '#c9ccd0';
  g.beginPath(); g.moveTo(tx - tw * 0.6, base - tw * 0.3); g.lineTo(tx + tw * 0.6, base - tw * 0.3);
  g.lineTo(tx + tw * 0.4, top); g.lineTo(tx - tw * 0.4, top); g.closePath(); g.fill();
  g.fillStyle = 'rgba(10,14,22,0.55)';      // the side away from the moonless sky
  g.beginPath(); g.moveTo(tx + tw * 0.1, base - tw * 0.3); g.lineTo(tx + tw * 0.6, base - tw * 0.3);
  g.lineTo(tx + tw * 0.4, top); g.lineTo(tx + tw * 0.07, top); g.closePath(); g.fill();
  // a locked door, a few windows
  g.fillStyle = '#2a2f36'; g.fillRect(tx - tw * 0.14, base - tw * 0.3 - tw * 0.55, tw * 0.28, tw * 0.55);
  g.fillStyle = '#1a1f26';
  for (let i = 1; i < 4; i++) g.fillRect(tx - tw * 0.06, base - th * (0.25 * i), tw * 0.12, tw * 0.2);
  // gallery and lantern
  g.fillStyle = '#20252c'; g.fillRect(tx - tw * 0.62, top - tw * 0.08, tw * 1.24, tw * 0.1);
  const ly = top - tw * 0.38, b = brightness();
  g.fillStyle = `rgba(255,236,190,${0.25 + 0.75 * b})`; g.fillRect(tx - tw * 0.32, top - tw * 0.6, tw * 0.64, tw * 0.52);
  g.fillStyle = '#20252c';
  g.beginPath(); g.moveTo(tx - tw * 0.42, top - tw * 0.6); g.lineTo(tx, top - tw * 0.95); g.lineTo(tx + tw * 0.42, top - tw * 0.6); g.closePath(); g.fill();
  // beams: each panel throws one; its length on screen is how far it points sideways
  for (const p of PANELS) {
    const th0 = angle(p), side = Math.cos(th0), f = facing(th0), back = Math.max(0, -Math.sin(th0));
    const len = Math.abs(side) * W * 1.3, a = 0.05 + 0.18 * (1 - back) * Math.min(1, Math.abs(side) * 2);
    if (Math.abs(side) < 0.03) continue;
    const grad = g.createLinearGradient(tx, ly, tx + Math.sign(side) * len, ly);
    grad.addColorStop(0, `rgba(255,236,190,${a})`); grad.addColorStop(1, 'rgba(255,236,190,0)');
    g.fillStyle = grad;
    g.beginPath(); g.moveTo(tx, ly - tw * 0.12); g.lineTo(tx + Math.sign(side) * len, ly - tw * (0.6 + f));
    g.lineTo(tx + Math.sign(side) * len, ly + tw * (0.6 + f)); g.lineTo(tx, ly + tw * 0.12); g.closePath(); g.fill();
  }
  // the flash, when a panel looks straight out of the screen
  if (b > 0.01) {
    const r = tw * (1 + 9 * b);
    const glow = g.createRadialGradient(tx, ly, 0, tx, ly, r);
    glow.addColorStop(0, `rgba(255,244,214,${0.9 * b})`); glow.addColorStop(1, 'rgba(255,244,214,0)');
    g.fillStyle = glow; g.fillRect(tx - r, ly - r, r * 2, r * 2);
    g.fillStyle = `rgba(255,236,190,${0.25 * b})`;     // its path on the water
    g.beginPath(); g.moveTo(tx - tw * 0.3, H * 0.76); g.lineTo(tx + tw * 0.3, H * 0.76); g.lineTo(tx + tw * 2.5, H); g.lineTo(tx - tw * 2.5, H); g.closePath(); g.fill();
  }
  // moths at the glass
  g.fillStyle = 'rgba(230,220,200,0.8)';
  for (const m of moths) g.fillRect(tx + Math.cos(m.a) * tw * m.r * 0.7, ly + Math.sin(m.a * 1.3) * tw * 0.5, 2, 2);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  step(dt); draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// for looking at it: #flash starts just before the first flash, #beam with a beam to the side
if (location.hash === '#flash') T = PERIOD - 1.3;
if (location.hash === '#beam') T = PERIOD * 0.3;
window.__light = { get T() { return T; }, turns: () => turns, brightness };
</script>
</body>
</html>
