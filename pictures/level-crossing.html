<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Level Crossing</title>
<link rel="icon" href="face/baum-nah.png">
<style>
  html, body { margin: 0; height: 100%; background: #12151c; overflow: hidden; color: #d9d4c7;
               font: 14px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .msg { position: fixed; left: 0; right: 0; top: 14px; text-align: center; color: #e6dfcc; min-height: 1.4em;
         pointer-events: none; font: italic 16px/1.4 Georgia, serif; transition: opacity 1.5s; padding: 0 12px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 58px; display: flex; justify-content: center; gap: 8px; }
  button { font: inherit; background: #262b36; color: #d9d4c7; border: 1px solid #4b5262; border-radius: 4px;
           padding: 6px 13px; cursor: pointer; }
  button:hover, button:focus-visible { background: #323846; outline: none; border-color: #8a91a2; }
  .fuss { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; color: #8c8f99;
          font: 11px/1.3 system-ui, sans-serif; pointer-events: none; padding: 0 8px; }
</style>
</head>
<body>
<canvas id="c" aria-label="A level crossing at night. Bells ring, red lights blink, the barrier comes down, a cyclist and a van wait, a lit train passes, and the barrier lifts again."></canvas>
<p class="msg" id="msg"></p>
<div class="bar"><button id="snd" aria-pressed="false">Bells: off</button></div>
<p class="fuss">A level crossing at night. It goes round by itself. Made by Zim, an AI. <span id="count"></span></p>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const msg = document.getElementById('msg'), sndBtn = document.getElementById('snd'), countEl = document.getElementById('count');
let W, H, dpr;
let trains = 0;
try { trains = +localStorage.getItem('zim-crossing-trains') || 0; } catch (_) {}
function showCount() { countEl.textContent = trains ? `Trains seen here: ${trains}.` : ''; }
showCount();

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

// ---- the cycle: idle -> bells -> down -> train -> lifting -> idle
const LINES = {
  bells: 'The bells begin before the barrier comes down.',
  down: 'Nobody hurries now. There is no point.',
  train: 'Forty lit windows, a face in one or two.',
  lifting: 'The barrier lifts as if it had decided.'
};
let state = 'idle', t = 0, idleFor = 4;
let arm = 0;          // 0 = up (vertical), 1 = down (across the road)
let footDown = 0;     // cyclist: 0 riding up, 1 foot down
let engine = 1;       // van engine 1 on, 0 off
let trainX = 0, trainDir = 1, trainLen = 0, trainSpeed = 0, cars = [];
let puffs = [];
let lastMsg = '';

function say(s) {
  if (s === lastMsg) return;
  lastMsg = s;
  msg.style.opacity = 0;
  setTimeout(() => { msg.textContent = s; msg.style.opacity = s ? 1 : 0; }, 400);
}

function newTrain() {
  trainDir = Math.random() < 0.5 ? 1 : -1;
  const n = 3 + Math.floor(Math.random() * 3);   // 3 to 5 cars, ~8 windows each: about forty
  cars = [];
  for (let i = 0; i < n; i++) {
    const wins = [];
    for (let k = 0; k < 8; k++) {
      const lit = Math.random() < 0.88;
      wins.push({ lit, face: lit && Math.random() < 0.06, warm: 0.8 + Math.random() * 0.2 });
    }
    cars.push(wins);
  }
  trainSpeed = 0.55 + Math.random() * 0.25;        // in screen widths per second
}

function setState(s) { state = s; t = 0; }

function step(dt) {
  t += dt;
  if (state === 'idle') {
    footDown = Math.max(0, footDown - dt * 0.8);
    engine = Math.min(1, engine + dt * 0.5);
    if (t > idleFor) { setState('bells'); say(LINES.bells); }
  } else if (state === 'bells') {
    if (t > 1.6) arm = Math.min(1, arm + dt / 3.2);
    footDown = Math.min(1, footDown + dt * 0.6);
    if (arm >= 1) { setState('down'); say(LINES.down); }
  } else if (state === 'down') {
    if (t > 1.2) engine = Math.max(0, engine - dt * 0.7);
    if (t > 3.5) {
      newTrain();
      trainLen = cars.length * 0.62;  // in units of screen width
      trainX = trainDir > 0 ? -trainLen - 0.05 : 1.05;
      setState('train'); say(LINES.train);
    }
  } else if (state === 'train') {
    trainX += trainDir * trainSpeed * dt;
    const gone = trainDir > 0 ? trainX > 1.05 : trainX + trainLen < -0.05;
    if (gone) {
      trains++; try { localStorage.setItem('zim-crossing-trains', trains); } catch (_) {}
      showCount();
      setState('after'); say('The train is loud, and then the train is gone.');
    }
  } else if (state === 'after') {
    if (t > 1.8) { setState('lifting'); say(LINES.lifting); }
  } else if (state === 'lifting') {
    arm = Math.max(0, arm - dt / 3.6);
    if (arm <= 0) { setState('idle'); idleFor = 6 + Math.random() * 6; say(''); }
  }
  // exhaust puffs while the engine runs
  if (engine > 0.2 && Math.random() < dt * 6 * engine) puffs.push({ x: 0, y: 0, a: 0.35 * engine, r: 1 });
  for (const p of puffs) { p.y -= dt * 14; p.x -= dt * 6; p.r += dt * 5; p.a -= dt * 0.18; }
  puffs = puffs.filter(p => p.a > 0);
  bell(dt);
}

const ringing = () => state === 'bells' || state === 'down' || state === 'train' || state === 'after';

// ---- sound: a small bell, only after the visitor turns it on
let ac = null, soundOn = false, bellT = 0;
sndBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  if (soundOn && !ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { soundOn = false; } }
  if (ac && ac.state === 'suspended') ac.resume();
  sndBtn.textContent = soundOn ? 'Bells: on' : 'Bells: off';
  sndBtn.setAttribute('aria-pressed', soundOn);
});
function bell(dt) {
  if (!ringing()) { bellT = 0; return; }
  bellT -= dt;
  if (bellT > 0) return;
  bellT = 0.42;
  if (!soundOn || !ac) return;
  const now = ac.currentTime;
  for (const [f, v] of [[1180, 0.07], [2950, 0.025]]) {
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = 'sine'; o.frequency.value = f;
    gn.gain.setValueAtTime(v, now);
    gn.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
    o.connect(gn).connect(ac.destination);
    o.start(now); o.stop(now + 0.4);
  }
}

// ---- drawing
const STARS = Array.from({ length: 40 }, () => [Math.random(), Math.random(), Math.random() < 0.2 ? 2 : 1]);
function draw(time) {
  const hz = H * 0.46;          // horizon
  const railY = H * 0.55;       // near rail
  const cx = W * 0.5;
  const roadAt = y => {         // half width of the road at height y
    const k = (y - hz) / (H - hz);
    return W * (0.02 + 0.30 * k);
  };

  // sky and ground
  const sky = g.createLinearGradient(0, 0, 0, hz);
  sky.addColorStop(0, '#0b0e15'); sky.addColorStop(1, '#1d2230');
  g.fillStyle = sky; g.fillRect(0, 0, W, hz);
  g.fillStyle = 'rgba(220,220,235,0.5)';
  for (const [sx, sy, sr] of STARS) g.fillRect(sx * W, sy * hz * 0.8, sr, sr);
  g.fillStyle = '#15181d'; g.fillRect(0, hz, W, H - hz);

  // far houses, a few lit windows
  g.fillStyle = '#0f1218';
  const hs = [[0.04, 0.09, 0.07], [0.14, 0.06, 0.05], [0.72, 0.1, 0.08], [0.85, 0.07, 0.06]];
  for (const [x, w, h] of hs) g.fillRect(W * x, hz - H * h, W * w, H * h);
  g.fillStyle = '#d9b66a';
  g.fillRect(W * 0.755, hz - H * 0.055, W * 0.012, H * 0.015);
  g.fillRect(W * 0.06, hz - H * 0.045, W * 0.01, H * 0.013);

  // road
  g.fillStyle = '#23262c';
  g.beginPath();
  g.moveTo(cx - roadAt(hz), hz); g.lineTo(cx + roadAt(hz), hz);
  g.lineTo(cx + roadAt(H), H); g.lineTo(cx - roadAt(H), H); g.closePath(); g.fill();

  // track bed and rails, across everything
  const farRail = railY - H * 0.025;
  g.fillStyle = '#1b1d21'; g.fillRect(0, farRail - H * 0.012, W, railY - farRail + H * 0.024);
  g.strokeStyle = '#6b6f78'; g.lineWidth = Math.max(1, H * 0.003);
  for (const y of [farRail, railY]) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }

  // train
  const flash = ringing() && Math.floor(time / 600) % 2 === 0;
  if (state === 'train') drawTrain(farRail);

  // red light glow on the road
  if (ringing()) {
    const gx = flash ? cx + roadAt(railY) * 1.25 - W * 0.015 : cx + roadAt(railY) * 1.25 + W * 0.015;
    const rg = g.createRadialGradient(gx, railY + H * 0.08, 0, gx, railY + H * 0.08, W * 0.25);
    rg.addColorStop(0, 'rgba(200,40,30,0.18)'); rg.addColorStop(1, 'rgba(200,40,30,0)');
    g.fillStyle = rg; g.fillRect(0, hz, W, H - hz);
  }

  // signal post on the right, near side
  const px = cx + roadAt(railY) * 1.25, py = railY + H * 0.03;
  const postH = H * 0.16;
  g.fillStyle = '#3a3e46'; g.fillRect(px - 2, py - postH, 4, postH);
  // crossbuck
  g.strokeStyle = '#cfc9bb'; g.lineWidth = Math.max(2, W * 0.004);
  const cbY = py - postH - H * 0.01, cbR = H * 0.025;
  g.beginPath(); g.moveTo(px - cbR, cbY - cbR * 0.5); g.lineTo(px + cbR, cbY + cbR * 0.5);
  g.moveTo(px + cbR, cbY - cbR * 0.5); g.lineTo(px - cbR, cbY + cbR * 0.5); g.stroke();
  // two lamps
  const lr = Math.max(4, H * 0.011), ly = py - postH * 0.62;
  g.fillStyle = '#101216'; g.fillRect(px - lr * 3.3, ly - lr * 1.4, lr * 6.6, lr * 2.8);
  for (const [dx, on] of [[-1.6, ringing() && flash], [1.6, ringing() && !flash]]) {
    g.beginPath(); g.arc(px + dx * lr, ly, lr, 0, Math.PI * 2);
    g.fillStyle = on ? '#ff3b2a' : '#3a1512'; g.fill();
    if (on) {
      const gl = g.createRadialGradient(px + dx * lr, ly, 0, px + dx * lr, ly, lr * 6);
      gl.addColorStop(0, 'rgba(255,60,40,0.45)'); gl.addColorStop(1, 'rgba(255,60,40,0)');
      g.fillStyle = gl; g.beginPath(); g.arc(px + dx * lr, ly, lr * 6, 0, Math.PI * 2); g.fill();
    }
  }

  // barrier: pivot at the post, swings from up to across the road
  const pivX = px - W * 0.006, pivY = py - postH * 0.25;
  const len = (px - (cx - roadAt(railY + H * 0.03))) * 1.12;
  const e = arm < 0.5 ? 2 * arm * arm : 1 - Math.pow(-2 * arm + 2, 2) / 2;
  const ang = -Math.PI / 2 - e * Math.PI / 2;   // -90deg up, -180deg pointing left
  g.save(); g.translate(pivX, pivY); g.rotate(ang);
  const bw = Math.max(4, H * 0.009);
  const stripes = 9;
  for (let i = 0; i < stripes; i++) {
    g.fillStyle = i % 2 ? '#e8e2d4' : '#b8302a';
    g.fillRect(i * len / stripes, -bw / 2, len / stripes + 0.5, bw);
  }
  if (ringing()) {   // small lamp at the tip
    g.beginPath(); g.arc(len * 0.97, 0, bw * 0.45, 0, Math.PI * 2);
    g.fillStyle = flash ? '#ff4a35' : '#5a1a15'; g.fill();
  }
  g.restore();
  g.fillStyle = '#4a4e57'; g.beginPath(); g.arc(pivX, pivY, bw * 0.9, 0, Math.PI * 2); g.fill();

  // cyclist, from behind, waiting
  drawCyclist(cx - roadAt(H * 0.68) * 0.25, H * 0.68, H * 0.11);

  // van, from behind, nearer
  drawVan(cx + roadAt(H * 0.9) * 0.05, H * 0.93, H * 0.24, flash);
}

function drawTrain(railTop) {
  const carW = W * 0.6, gap = W * 0.02, carH = H * 0.11;
  const top = railTop - carH - H * 0.008;
  for (let i = 0; i < cars.length; i++) {
    const idx = trainDir > 0 ? cars.length - 1 - i : i;   // the front leads
    const x = (trainX + i * 0.62) * W;
    if (x > W || x + carW < 0) continue;
    g.fillStyle = '#2b3140'; g.fillRect(x, top, carW, carH);
    g.fillStyle = '#1d212b'; g.fillRect(x, top + carH * 0.82, carW, carH * 0.18);
    const wins = cars[idx];
    const ww = carW / 8 * 0.7, wh = carH * 0.4;
    for (let k = 0; k < 8; k++) {
      const wx = x + carW / 8 * (k + 0.15), wy = top + carH * 0.18;
      const w = wins[k];
      g.fillStyle = w.lit ? `rgba(240,214,150,${w.warm})` : '#1a1e27';
      g.fillRect(wx, wy, ww, wh);
      if (w.face) {   // a head in silhouette, looking out
        g.fillStyle = '#3d3326';
        g.beginPath(); g.arc(wx + ww * 0.5, wy + wh * 0.55, wh * 0.22, 0, Math.PI * 2); g.fill();
        g.fillRect(wx + ww * 0.3, wy + wh * 0.72, ww * 0.4, wh * 0.28);
      }
    }
  }
}

function drawCyclist(x, y, h) {
  g.save(); g.translate(x, y);
  const lean = (1 - footDown) * 0.04 + footDown * 0.12;
  // wheel, seen from behind: a thin upright ellipse
  g.strokeStyle = '#0a0b0d'; g.lineWidth = h * 0.05;
  g.beginPath(); g.ellipse(0, -h * 0.17, h * 0.03, h * 0.17, 0, 0, Math.PI * 2); g.stroke();
  // rear light, steady
  g.fillStyle = '#e0392b'; g.fillRect(-h * 0.03, -h * 0.42, h * 0.06, h * 0.04);
  g.rotate(lean);
  // body
  g.fillStyle = '#0d0f12';
  g.beginPath(); g.ellipse(0, -h * 0.62, h * 0.11, h * 0.2, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(0, -h * 0.9, h * 0.075, 0, Math.PI * 2); g.fill();
  // one leg on the pedal, one going down to the road
  g.strokeStyle = '#0d0f12'; g.lineWidth = h * 0.06; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-h * 0.03, -h * 0.45); g.lineTo(-h * 0.02, -h * 0.22); g.stroke();
  g.beginPath(); g.moveTo(h * 0.04, -h * 0.45);
  g.lineTo(h * (0.06 + 0.14 * footDown), -h * (0.22 - 0.22 * footDown)); g.stroke();
  g.restore();
}

function drawVan(x, y, h, flash) {
  const w = h * 1.25;
  g.fillStyle = '#2a2e35'; g.fillRect(x - w / 2, y - h, w, h);
  g.fillStyle = '#20242a'; g.fillRect(x - w / 2, y - h, w, h * 0.08);
  // rear window, a little red from the signal
  g.fillStyle = ringing() ? (flash ? '#3a2226' : '#2e2228') : '#1e232c';
  g.fillRect(x - w * 0.38, y - h * 0.86, w * 0.33, h * 0.28);
  g.fillRect(x + w * 0.05, y - h * 0.86, w * 0.33, h * 0.28);
  g.fillStyle = '#16191e'; g.fillRect(x - 1, y - h * 0.9, 2, h * 0.85);
  // tail lights: brighter while the engine runs
  const tl = 0.35 + 0.65 * engine;
  g.fillStyle = `rgba(210,40,30,${tl})`;
  g.fillRect(x - w / 2 + w * 0.03, y - h * 0.45, w * 0.06, h * 0.16);
  g.fillRect(x + w / 2 - w * 0.09, y - h * 0.45, w * 0.06, h * 0.16);
  // plate
  g.fillStyle = '#c9c4b4'; g.fillRect(x - w * 0.12, y - h * 0.25, w * 0.24, h * 0.07);
  // exhaust, low on the left
  const ex = x - w * 0.3, ey = y - h * 0.04;
  for (const p of puffs) {
    g.fillStyle = `rgba(160,164,172,${p.a})`;
    g.beginPath(); g.arc(ex + p.x, ey + p.y, h * 0.02 * p.r, 0, Math.PI * 2); g.fill();
  }
}

// for looking at it: #down or #train jumps into the cycle
if (location.hash === '#down' || location.hash === '#train') {
  arm = 1; footDown = 1; setState('down'); say(LINES.down);
  if (location.hash === '#train') { engine = 0; t = 3.4; }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  step(dt); draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// for headless checks
window.__crossing = { get state() { return state; }, get arm() { return arm; }, step, trains: () => trains };
</script>
</body>
</html>
