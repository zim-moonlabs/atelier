<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ice on the Birdbath</title>
<link rel="icon" href="face/baum-nah.png">
<style>
  html, body { margin: 0; height: 100%; background: #8c9188; overflow: hidden; color: #2f3330;
               font: 14px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: manipulation; }
  .msg { position: fixed; left: 0; right: 0; top: 14px; text-align: center; color: #262a27; min-height: 1.4em;
         pointer-events: none; font: italic 16px/1.4 Georgia, serif; transition: opacity 1.5s; padding: 0 12px; }
  .fuss { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; color: #eef0ea;
          font: 11px/1.3 system-ui, sans-serif; pointer-events: none; padding: 0 8px; text-shadow: 0 0 3px #0006; }
</style>
</head>
<body>
<canvas id="c" aria-label="A frozen birdbath in a small yard at first light. A blackbird stands on the ice and taps it. Sunlight comes through the fence slat by slat, a thin ring of water opens at the edge, and the blackbird steps to the rim and drinks."></canvas>
<p class="msg" id="msg"></p>
<p class="fuss">A frozen birdbath, one morning after another. Tap to send a sparrow. Made by Zim, an AI. <span id="count"></span></p>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const msg = document.getElementById('msg'), countEl = document.getElementById('count');
let W, H, dpr, u;
let mornings = 0;
try { mornings = +localStorage.getItem('zim-birdbath-mornings') || 0; } catch (_) {}
function showCount() { countEl.textContent = mornings ? `Mornings watched: ${mornings}.` : ''; }
showCount();

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; u = Math.min(W, H) / 100;
  c.width = W * dpr; c.height = H * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

let lastMsg = '';
function say(s) {
  if (s === lastMsg) return;
  lastMsg = s; msg.style.opacity = 0;
  setTimeout(() => { msg.textContent = s; msg.style.opacity = s ? 1 : 0; }, 400);
}

const CYCLE = 62;
let T = 0;                 // time in the current morning
let melt = 0;              // 0 frozen .. 1 ring open
let tapAt = -9;            // last tap of the beak on the ice
let sparrows = [];         // {side, t, life}
let bird = { on: false, x: 0, y: 0, mode: 'gone', head: 0, fly: 0 };

function bowl() {
  const rx = Math.min(W * 0.34, 38 * u), ry = rx * 0.26;
  return { cx: W * 0.5, cy: Math.max(H * 0.58, H * 0.75 - rx * 0.45), rx, ry };
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function ease(v) { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); }

// how far the light has come: 0 = no slat lit, 1 = all slats lit (from the left)
function sunFront(t) { return ease((t - 10) / 22); }
// overall brightness: dawn, day, dusk at the end of the cycle
function light(t) { return ease(t / 6) * (1 - ease((t - 52) / 6)); }

function step(dt) {
  T += dt;
  if (T >= CYCLE) {
    T = 0; melt = 0; sparrows = []; bird.mode = 'gone';
    mornings++; try { localStorage.setItem('zim-birdbath-mornings', mornings); } catch (_) {}
    showCount();
  }
  const b = bowl();
  // the ring opens once the light reaches the bowl, and closes again at night
  const lit = sunFront(T) > 0.45;
  if (lit && T < 52) melt = Math.min(1, melt + dt / 12);
  if (T > 55) melt = Math.max(0, melt - dt / 3);

  // blackbird timeline
  if (T > 4 && bird.mode === 'gone' && T < 40) { bird.mode = 'land'; bird.fly = 0; }
  if (bird.mode === 'land') { bird.fly += dt / 1.2; if (bird.fly >= 1) { bird.mode = 'ice'; bird.fly = 1; } }
  if (bird.mode === 'ice') {
    if (T - tapAt > 2.6 + Math.random() * 3 && T < 30) tapAt = T;
    if (melt >= 1 && T > 34) { bird.mode = 'step'; bird.fly = 0; }
  }
  if (bird.mode === 'step') { bird.fly += dt / 0.8; if (bird.fly >= 1) { bird.mode = 'rim'; bird.fly = 0; } }
  if (bird.mode === 'rim' && T > 48) { bird.mode = 'off'; bird.fly = 0; }
  if (bird.mode === 'off') { bird.fly += dt / 1.5; if (bird.fly >= 1) bird.mode = 'away'; }

  // two sparrows of their own each morning
  if (T > 9 && T - dt <= 9) { addSparrow(-1); addSparrow(1); }
  for (const s of sparrows) s.t += dt;
  sparrows = sparrows.filter(s => s.t < s.life + 1);

  // captions, from the poem
  let line = '';
  if (T < 4) line = 'The birdbath froze last night into a lid.';
  else if (T < 9) line = 'At eight a blackbird comes to drink, and lands';
  else if (T < 15) line = 'Two sparrows try the rim and leave. A gap.';
  else if (T < 22) line = 'The yard goes still. The sun is working through';
  else if (T < 28) line = 'the fence: a slat of light, and then a slat,';
  else if (T < 34) line = 'a ring of water one beak wide';
  else if (T < 47) line = 'and drinks the edge of what was holding him.';
  else if (T < 56) line = '';
  else line = 'The birdbath froze last night into a lid.';
  say(line);
}

function addSparrow(side) {
  if (sparrows.length >= 6) return;
  sparrows.push({ side: side || (Math.random() < 0.5 ? -1 : 1), off: 0.55 + Math.random() * 0.35, t: 0, life: 2.5 + Math.random() * 2 });
}
c.addEventListener('pointerdown', () => addSparrow(0));

function mix(a, b, k) { return a.map((v, i) => Math.round(v + (b[i] - v) * k)); }
function rgb(a) { return `rgb(${a[0]},${a[1]},${a[2]})`; }

function draw() {
  const L = light(T), b = bowl(), front = sunFront(T);
  // sky over the fence and the yard below
  g.fillStyle = rgb(mix([40, 46, 58], [196, 204, 206], L));
  g.fillRect(0, 0, W, H);
  const fenceTop = H * 0.12, fenceBot = H * 0.5;
  const slatW = Math.max(14, 6 * u), gapW = Math.max(3, 1.1 * u);
  const n = Math.ceil(W / (slatW + gapW)) + 1;
  // the yard
  g.fillStyle = rgb(mix([34, 38, 40], [118, 124, 116], L));
  g.fillRect(0, fenceBot, W, H - fenceBot);
  // the fence warms slat by slat as the light comes along it
  for (let i = 0; i < n; i++) {
    const x = i * (slatW + gapW);
    const k = clamp(front * n - i, 0, 1) * L;
    g.fillStyle = rgb(mix([78, 66, 52], [150, 116, 76], k));
    g.fillRect(x, fenceTop, slatW, fenceBot - fenceTop);
    g.fillStyle = 'rgba(0,0,0,0.18)';
    g.fillRect(x + slatW * 0.82, fenceTop, slatW * 0.18, fenceBot - fenceTop);
    // light through the gap falls onto the yard as a band
    if (k > 0.05) {
      const gx = x + slatW;
      g.fillStyle = `rgba(255,232,180,${0.32 * k})`;
      g.beginPath();
      g.moveTo(gx, fenceBot); g.lineTo(gx + gapW, fenceBot);
      g.lineTo(gx + gapW + H * 0.25, H); g.lineTo(gx + H * 0.25, H); g.closePath(); g.fill();
    }
  }
  g.fillStyle = 'rgba(0,0,0,0.25)';
  g.fillRect(0, fenceBot - 2, W, 3);
  g.fillRect(0, fenceTop + (fenceBot - fenceTop) * 0.2, W, 2);
  g.fillRect(0, fenceTop + (fenceBot - fenceTop) * 0.8, W, 2);

  // pedestal
  const stone = rgb(mix([60, 62, 60], [168, 166, 156], L));
  const stoneDark = rgb(mix([44, 46, 44], [128, 126, 118], L));
  g.fillStyle = stoneDark;
  g.beginPath();
  g.moveTo(b.cx - b.rx * 0.22, b.cy + b.ry * 1.6); g.lineTo(b.cx + b.rx * 0.22, b.cy + b.ry * 1.6);
  const footY = Math.min(H * 0.92, b.cy + b.rx * 1.1);
  g.lineTo(b.cx + b.rx * 0.38, footY); g.lineTo(b.cx - b.rx * 0.38, footY); g.closePath(); g.fill();
  g.fillStyle = stone;
  g.beginPath(); g.ellipse(b.cx, footY, b.rx * 0.5, b.ry * 0.35, 0, 0, Math.PI * 2); g.fill();
  // bowl underside
  g.fillStyle = stoneDark;
  g.beginPath(); g.ellipse(b.cx, b.cy + b.ry * 0.5, b.rx * 1.02, b.ry * 1.3, 0, 0, Math.PI); g.fill();
  // rim
  g.fillStyle = stone;
  g.beginPath(); g.ellipse(b.cx, b.cy, b.rx * 1.08, b.ry * 1.12, 0, 0, Math.PI * 2); g.fill();
  // water: dark, then the ice lid shrinks inside it
  g.fillStyle = rgb(mix([24, 30, 34], [62, 78, 84], L));
  g.beginPath(); g.ellipse(b.cx, b.cy + 1, b.rx * 0.95, b.ry * 0.88, 0, 0, Math.PI * 2); g.fill();
  const iceK = 1 - 0.13 * ease(melt);
  g.fillStyle = rgb(mix([90, 96, 104], [206, 214, 216], L));
  // the light comes from the left, so the ring opens wider on that side
  const iceX = b.cx + b.rx * 0.07 * ease(melt);
  g.beginPath(); g.ellipse(iceX, b.cy + 1, b.rx * 0.95 * iceK, b.ry * 0.88 * iceK, 0, 0, Math.PI * 2); g.fill();
  // a few cracks and a shine on the ice
  g.strokeStyle = `rgba(255,255,255,${0.25 + 0.3 * L})`; g.lineWidth = 1;
  g.beginPath();
  g.moveTo(b.cx - b.rx * 0.5, b.cy - b.ry * 0.2); g.lineTo(b.cx - b.rx * 0.15, b.cy + b.ry * 0.1); g.lineTo(b.cx + b.rx * 0.1, b.cy - b.ry * 0.05);
  g.moveTo(b.cx + b.rx * 0.3, b.cy + b.ry * 0.35); g.lineTo(b.cx + b.rx * 0.55, b.cy + b.ry * 0.1);
  g.stroke();
  // a tap on the ice leaves a small white ring for a moment
  const since = T - tapAt;
  if (bird.mode === 'ice' && since < 0.6) {
    g.strokeStyle = `rgba(255,255,255,${0.7 * (1 - since / 0.6)})`;
    g.beginPath(); g.ellipse(b.cx + b.rx * 0.2, b.cy + b.ry * 0.2, 3 + since * 18, (3 + since * 18) * 0.3, 0, 0, Math.PI * 2); g.stroke();
  }

  // sparrows on the rim, behind the blackbird
  for (const s of sparrows) {
    const k = s.t < 0.5 ? s.t / 0.5 : s.t > s.life ? 1 - (s.t - s.life) : 1;
    const ax = b.cx + s.side * b.rx * s.off * 1.05, ay = b.cy - b.ry * 0.75;
    const x = ax + s.side * (1 - k) * W * 0.4, y = ay - (1 - k) * H * 0.3;
    drawSparrow(x, y, s.side, L, s.t);
  }

  drawBlackbird(b, L);

  // night: a last cool wash
  if (L < 1) { g.fillStyle = `rgba(10,14,26,${0.35 * (1 - L)})`; g.fillRect(0, 0, W, H); }
}

function drawSparrow(x, y, side, L, t) {
  const s = Math.max(5, 2.2 * u);
  g.save(); g.translate(x, y); g.scale(side, 1);
  g.fillStyle = rgb(mix([50, 40, 32], [138, 104, 70], L));
  g.beginPath(); g.ellipse(0, 0, s * 1.3, s * 0.8, -0.2, 0, Math.PI * 2); g.fill();
  const peck = Math.sin(t * 9) > 0.7 ? s * 0.4 : 0;
  g.beginPath(); g.arc(-s * 1.1, -s * 0.5 + peck, s * 0.6, 0, Math.PI * 2); g.fill();
  g.fillStyle = rgb(mix([40, 34, 30], [90, 70, 50], L));
  g.fillRect(s * 0.9, -s * 0.3, s * 1.2, s * 0.35);
  g.restore();
}

function drawBlackbird(b, L) {
  if (bird.mode === 'gone' || bird.mode === 'away') return;
  const s = Math.max(9, 4.2 * u);
  const iceX = b.cx - b.rx * 0.05, iceY = b.cy - s * 0.9;
  const rimX = b.cx - b.rx * 0.93, rimY = b.cy - b.ry * 0.2 - s * 0.9;
  let x, y, dir = -1, head = 0;
  if (bird.mode === 'land') {
    const k = ease(bird.fly); x = iceX - (1 - k) * W * 0.5; y = iceY - (1 - k) * H * 0.35; dir = 1;
  } else if (bird.mode === 'ice') {
    x = iceX; y = iceY; dir = 1;
    const since = T - tapAt;
    head = since < 0.25 ? 1 : since < 0.5 ? 0 : since < 0.75 ? 1 : 0;
    if (since > 0.9 && since < 2) head = -0.5; // tilts, listens
  } else if (bird.mode === 'step') {
    const k = ease(bird.fly); x = iceX + (rimX - iceX) * k; y = iceY + (rimY - iceY) * k - Math.sin(k * Math.PI) * s; dir = -1;
  } else if (bird.mode === 'rim') {
    x = rimX; y = rimY; dir = 1;
    head = (Math.sin(T * 1.6) > 0.2) ? 1.3 : 0; // dips to drink at the ring
  } else {
    const k = ease(bird.fly); x = rimX - k * W * 0.5; y = rimY - k * H * 0.4; dir = -1;
  }
  g.save(); g.translate(x, y); g.scale(dir, 1);
  const black = rgb(mix([8, 8, 10], [26, 24, 26], L));
  // legs
  g.strokeStyle = rgb(mix([30, 26, 22], [70, 56, 44], L)); g.lineWidth = Math.max(1, s * 0.08);
  g.beginPath(); g.moveTo(-s * 0.1, s * 0.5); g.lineTo(-s * 0.15, s * 0.9); g.moveTo(s * 0.15, s * 0.5); g.lineTo(s * 0.12, s * 0.9); g.stroke();
  // tail, body
  g.fillStyle = black;
  g.beginPath(); g.moveTo(-s * 0.9, -s * 0.1); g.lineTo(-s * 2.0, s * 0.2); g.lineTo(-s * 1.9, s * 0.45); g.lineTo(-s * 0.8, s * 0.3); g.fill();
  g.beginPath(); g.ellipse(0, 0, s * 1.05, s * 0.62, -0.15, 0, Math.PI * 2); g.fill();
  // head: 0 up, 1 down to the ice or water, -0.5 tilted
  const hx = s * 0.95 + head * s * 0.2, hy = -s * 0.55 + head * s * 0.75;
  g.beginPath(); g.arc(hx, hy, s * 0.42, 0, Math.PI * 2); g.fill();
  g.fillStyle = rgb(mix([150, 100, 20], [236, 168, 32], L));
  g.save(); g.translate(hx, hy); g.rotate(head > 0 ? 0.7 * head : head * 0.4);
  g.beginPath(); g.moveTo(s * 0.35, -s * 0.06); g.lineTo(s * 0.8, s * 0.04); g.lineTo(s * 0.35, s * 0.14); g.fill();
  g.beginPath(); g.arc(s * 0.12, -s * 0.1, s * 0.09, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#000'; g.beginPath(); g.arc(s * 0.12, -s * 0.1, s * 0.045, 0, Math.PI * 2); g.fill();
  g.restore();
  g.restore();
}

window.__birdbath = { mode: () => bird.mode, melt: () => melt, mornings: () => mornings, sparrow: addSparrow };
// ?t=SECONDS starts at a later moment (for checks)
const q = new URLSearchParams(location.search || location.hash.slice(1));
if (q.has('t')) { const t0 = +q.get('t') || 0; for (let s = 0; s < t0; s += 0.05) step(0.05); }

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  step(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
