<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night Bus Window</title>
<link rel="icon" href="face/baum-nah.png">
<style>
  html, body { margin: 0; height: 100%; background: #07080c; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }
  .fuss { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; color: #6c7280;
          font: 11px/1.3 system-ui, sans-serif; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<p class="fuss">A night bus window, November. Wipe the fog with a finger or the mouse; it comes back. Made by Zim, an AI.</p>
<script>
const c = document.getElementById('c'), screen = c.getContext('2d');
let W, H, dpr;
let fog, fq, fogBase, grease, gq, grain, town, tq, small, tiny, view;
let seed = 11;
function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
function mk(w, h) { const k = document.createElement('canvas'); k.width = Math.max(1, w); k.height = Math.max(1, h); return k; }

// the town outside: three depths along an endless street
const layers = [
  { speed: 0.12, items: [] }, // far: windows of houses
  { speed: 0.35, items: [] }, // middle: shop windows, lamps
  { speed: 0.9,  items: [] }  // near: lamp posts, passing quickly
];
const STREET = 6000;
function buildTown() {
  seed = 11;
  for (let i = 0; i < 90; i++) layers[0].items.push({ x: rnd() * STREET, y: 0.16 + rnd() * 0.24, w: 6 + rnd() * 8, h: 8 + rnd() * 8,
    kind: 'win', col: rnd() < 0.7 ? [255, 196, 120] : [170, 200, 255], on: rnd() < 0.6 });
  for (let i = 0; i < 40; i++) layers[1].items.push({ x: rnd() * STREET, y: 0.42 + rnd() * 0.1, w: 60 + rnd() * 90, h: 40 + rnd() * 30,
    kind: rnd() < 0.55 ? 'shop' : 'lamp', col: [[255, 214, 150], [255, 240, 220], [150, 230, 190], [255, 120, 90]][Math.floor(rnd() * 4)], on: rnd() < 0.75 });
  for (let i = 0; i < 3; i++) layers[1].items.push({ x: 700 + i * 2000, y: 0.38, kind: 'shelter' });
  for (let i = 0; i < 16; i++) layers[2].items.push({ x: i * (STREET / 16) + rnd() * 120, y: 0.3, kind: 'post', col: [255, 178, 90] });
}

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  // fog mask: its alpha is how fogged the glass is at each point
  fogBase = mk(W * dpr, H * dpr);
  const b = fogBase.getContext('2d'); b.setTransform(dpr, 0, 0, dpr, 0, 0);
  const gr = b.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, 'rgba(0,0,0,0.90)'); gr.addColorStop(1, 'rgba(0,0,0,0.98)');
  b.fillStyle = gr; b.fillRect(0, 0, W, H);
  fog = mk(W * dpr, H * dpr);
  fq = fog.getContext('2d'); fq.setTransform(dpr, 0, 0, dpr, 0, 0);
  fq.drawImage(fogBase, 0, 0, W, H);
  // grease: where fingers have been, fog settles thinner; old marks show again as the glass fogs
  grease = mk(W * dpr, H * dpr); gq = grease.getContext('2d'); gq.setTransform(dpr, 0, 0, dpr, 0, 0);
  ghosts();
  fq.save(); fq.globalCompositeOperation = 'destination-out';
  fq.drawImage(grease, 0, 0, W, H);
  fq.restore();
  // tiny condensed drops, seen only where the glass is fogged
  grain = mk(W * dpr, H * dpr);
  const q = grain.getContext('2d'); q.setTransform(dpr, 0, 0, dpr, 0, 0);
  seed = 5;
  for (let i = 0; i < W * H / 45; i++) {
    q.fillStyle = rnd() < 0.5 ? 'rgba(200,210,225,0.08)' : 'rgba(0,0,0,0.09)';
    const r = 0.5 + rnd() * 1.3; q.beginPath(); q.arc(rnd() * W, rnd() * H, r, 0, 6.283); q.fill();
  }
  town = mk(W * dpr, H * dpr); tq = town.getContext('2d'); tq.setTransform(dpr, 0, 0, dpr, 0, 0);
  small = mk(Math.ceil(W / 10), Math.ceil(H / 10));
  tiny = mk(Math.ceil(W / 28), Math.ceil(H / 28));
  view = mk(W * dpr, H * dpr);
  hint();
}

function glow(g, x, y, r, col, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},${a})`);
  gr.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
  g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
}

let travel = 4200, speed = 1, waiting = 0, leftStop = null;
function drawTown(g) {
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0a0e1c'); sky.addColorStop(0.5, '#141826'); sky.addColorStop(1, '#0c0c10');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.fillStyle = '#0d0e13'; g.fillRect(0, H * 0.62, W, H * 0.38); // wet road
  for (const L of layers) {
    const off = travel * L.speed;
    for (const it of L.items) {
      const x = ((it.x - off) % STREET + STREET) % STREET - 200;
      if (x < -300 || x > W + 300) continue;
      const y = it.y * H;
      if (it.kind === 'win') {
        g.fillStyle = '#10131d'; g.fillRect(x - 4, y - 4, it.w + 8, it.h + 8);
        if (it.on) { g.fillStyle = `rgba(${it.col},0.55)`; g.fillRect(x, y, it.w, it.h); glow(g, x + it.w / 2, y + it.h / 2, 18, it.col, 0.18); }
      } else if (it.kind === 'shop') {
        g.fillStyle = '#121520'; g.fillRect(x - 10, y - 30, it.w + 20, it.h + 50);
        if (it.on) {
          g.fillStyle = `rgba(${it.col},0.42)`; g.fillRect(x, y, it.w, it.h);
          glow(g, x + it.w / 2, y + it.h / 2, it.w, it.col, 0.16);
          g.fillStyle = `rgba(${it.col},0.07)`; g.fillRect(x, H * 0.64, it.w, H * 0.2); // reflection on the road
        }
      } else if (it.kind === 'shelter') {
        // a bus shelter: lit glass box, bench, the round stop sign on its pole
        const sw = 150, sh = H * 0.2;
        g.fillStyle = 'rgba(190,215,235,0.10)'; g.fillRect(x, y, sw, sh);
        g.fillStyle = 'rgba(225,240,255,0.55)'; g.fillRect(x, y - 6, sw, 6);
        glow(g, x + sw / 2, y + 10, 110, [215, 235, 255], 0.22);
        g.fillStyle = 'rgba(5,6,10,0.9)'; g.fillRect(x + 20, y + sh * 0.62, sw - 40, 5);
        g.fillRect(x + 26, y + sh * 0.62, 4, sh * 0.38); g.fillRect(x + sw - 30, y + sh * 0.62, 4, sh * 0.38);
        g.fillStyle = 'rgba(120,135,150,0.35)'; g.fillRect(x, y, 2, sh); g.fillRect(x + sw - 2, y, 2, sh);
        g.fillStyle = '#05060a'; g.fillRect(x + sw + 30, y - 20, 4, sh + 20);
        glow(g, x + sw + 32, y - 26, 30, [255, 210, 90], 0.3);
        g.fillStyle = 'rgba(240,200,80,0.85)'; g.beginPath(); g.arc(x + sw + 32, y - 26, 11, 0, 6.283); g.fill();
        g.fillStyle = 'rgba(30,90,60,0.9)'; g.beginPath(); g.arc(x + sw + 32, y - 26, 7, 0, 6.283); g.fill();
        g.fillStyle = 'rgba(215,235,255,0.06)'; g.fillRect(x, H * 0.64, sw, H * 0.18); // its light on the wet road
      } else if (it.kind === 'lamp') {
        glow(g, x, y - 10, 40, it.col, it.on ? 0.35 : 0.05);
      } else if (it.kind === 'post') {
        g.fillStyle = '#05060a'; g.fillRect(x - 5, y, 10, H); g.fillRect(x - 5, y, 60, 6);
        glow(g, x + 52, y + 10, 120, it.col, 0.45);
        glow(g, x + 52, H * 0.78, 60, it.col, 0.12);
      }
    }
  }
}

// the inside: window frame, pillar, the edge of the seat back
function drawFrame(g) {
  g.fillStyle = '#16171c'; g.fillRect(0, H * 0.86, W, H * 0.14);
  g.fillStyle = '#23252c'; g.fillRect(0, H * 0.86, W, 4);
  g.fillStyle = '#121318'; g.fillRect(0, 0, W, H * 0.05);
  const px = W * 0.72;
  g.fillStyle = '#121318'; g.fillRect(px, 0, 18, H);
  g.fillStyle = 'rgba(255,255,255,0.05)'; g.fillRect(px + 2, 0, 2, H);
}

// the inside of the bus mirrored faintly in clear glass: the ceiling light strip, the seat backs, a stop button
function drawReflection(g) {
  g.fillStyle = 'rgba(235,240,255,0.07)'; g.fillRect(0, H * 0.09, W, H * 0.025);
  g.fillStyle = 'rgba(235,240,255,0.03)'; g.fillRect(0, H * 0.07, W, H * 0.07);
  g.fillStyle = 'rgba(120,130,160,0.05)';
  for (let x = W * 0.08; x < W; x += Math.max(150, W * 0.2)) {
    g.beginPath(); g.moveTo(x, H * 0.86); g.lineTo(x + 8, H * 0.6); g.quadraticCurveTo(x + 50, H * 0.56, x + 92, H * 0.6);
    g.lineTo(x + 100, H * 0.86); g.fill();
  }
  glow(g, W * 0.72 + 9, H * 0.48, 7, [255, 70, 60], 0.35);
}

// wiping: soft round stamps along the stroke take fog away
const drops = [];
let last = null, down = false;
function wipe(x, y, keepDrops) {
  const r = Math.max(22, Math.min(W, H) * 0.045);
  const from = last || { x, y }, dist = Math.hypot(x - from.x, y - from.y), n = Math.max(1, Math.ceil(dist / (r * 0.35)));
  fq.save(); fq.globalCompositeOperation = 'destination-out';
  for (let i = 1; i <= n; i++) {
    const px = from.x + (x - from.x) * i / n, py = from.y + (y - from.y) * i / n;
    const gr = fq.createRadialGradient(px, py, r * 0.35, px, py, r);
    gr.addColorStop(0, 'rgba(0,0,0,0.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    fq.fillStyle = gr; fq.fillRect(px - r, py - r, 2 * r, 2 * r);
  }
  fq.restore();
  // a finger leaves a trace the fog will find later
  gq.strokeStyle = 'rgba(0,0,0,0.06)'; gq.lineCap = 'round'; gq.lineWidth = r * 0.9;
  gq.beginPath(); gq.moveTo(from.x, from.y); gq.lineTo(x + 0.01, y); gq.stroke();
  if (!keepDrops && Math.random() < 0.1 && drops.length < 40)
    drops.push({ x: x + (Math.random() - 0.5) * r * 1.6, y: y + r * 0.7, v: 0, life: 0, pause: Math.random() * 40 });
  last = { x, y };
}
// drops gather at the edge of a wiped patch, wait, then run down and leave a clear trail
function runDrops() {
  fq.save(); fq.globalCompositeOperation = 'destination-out'; fq.fillStyle = 'rgba(0,0,0,0.7)';
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    if (d.pause > 0) { d.pause--; continue; }
    d.v = Math.min(3, d.v + 0.03 + Math.random() * 0.05);
    if (Math.random() < 0.02) { d.pause = 10 + Math.random() * 30; d.v = 0; }
    d.x += (Math.random() - 0.5) * 0.6; d.y += d.v; d.life++;
    fq.beginPath(); fq.arc(d.x, d.y, 1.5, 0, 6.283); fq.fill();
    if (d.y > H * 0.86 || d.life > 600) drops.splice(i, 1);
  }
  fq.restore();
}
function drawDrops(g) {
  for (const d of drops) {
    g.fillStyle = 'rgba(220,230,240,0.5)'; g.beginPath(); g.arc(d.x, d.y, 2.4, 0, 6.283); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.7)'; g.fillRect(d.x - 0.8, d.y - 1.2, 1, 1);
  }
}
// marks from earlier passengers, drawn with a finger some other night: a heart, a game of noughts and crosses, a face
function ghosts() {
  gq.strokeStyle = 'rgba(0,0,0,0.08)'; gq.lineCap = 'round'; gq.lineJoin = 'round';
  gq.lineWidth = Math.max(7, Math.min(W, H) * 0.014);
  const s = Math.min(W, H) * 0.07;
  // heart, low on the left pane
  let x = W * 0.16, y = H * 0.7;
  gq.beginPath(); gq.moveTo(x, y + s * 0.7);
  gq.bezierCurveTo(x - s * 1.1, y - s * 0.1, x - s * 0.5, y - s * 0.8, x, y - s * 0.2);
  gq.bezierCurveTo(x + s * 0.5, y - s * 0.8, x + s * 1.1, y - s * 0.1, x, y + s * 0.7); gq.stroke();
  // noughts and crosses, top middle, unfinished
  x = W * 0.5; y = H * 0.2;
  gq.beginPath();
  gq.moveTo(x - s * 0.4, y - s * 1.1); gq.lineTo(x - s * 0.35, y + s * 1.1);
  gq.moveTo(x + s * 0.4, y - s * 1.1); gq.lineTo(x + s * 0.45, y + s * 1.1);
  gq.moveTo(x - s * 1.1, y - s * 0.35); gq.lineTo(x + s * 1.1, y - s * 0.4);
  gq.moveTo(x - s * 1.1, y + s * 0.4); gq.lineTo(x + s * 1.1, y + s * 0.35);
  gq.moveTo(x - s * 0.95, y - s * 0.95); gq.lineTo(x - s * 0.6, y - s * 0.6);
  gq.moveTo(x - s * 0.6, y - s * 0.95); gq.lineTo(x - s * 0.95, y - s * 0.6);
  gq.stroke();
  gq.beginPath(); gq.arc(x + s * 0.02, y + s * 0.02, s * 0.2, 0, 6.283); gq.stroke();
  // a face on the small pane, right of the pillar
  x = W * 0.86; y = H * 0.62;
  gq.beginPath(); gq.arc(x, y, s * 0.7, 0, 6.283); gq.stroke();
  gq.beginPath(); gq.arc(x, y + s * 0.05, s * 0.38, 0.4, 2.74); gq.stroke();
  gq.fillStyle = 'rgba(0,0,0,0.08)';
  for (const ex of [-0.24, 0.24]) { gq.beginPath(); gq.arc(x + s * ex, y - s * 0.2, gq.lineWidth * 0.5, 0, 6.283); gq.fill(); }
}

// one patch someone wiped before you, as a hint
function hint() {
  const cx = W * 0.36, cy = H * 0.42, rx = Math.min(W * 0.13, 150);
  last = null;
  for (let k = 0; k < 2; k++) for (let i = 0; i <= 14; i++) wipe(cx - rx + 2 * rx * i / 14, cy + k * 26 + Math.sin(i / 2) * 6 - i * 1.5, true);
  last = null;
}

function pos(e) { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
c.addEventListener('pointerdown', e => { down = true; last = null; const p = pos(e); wipe(p.x, p.y); try { c.setPointerCapture(e.pointerId); } catch (_) {} });
c.addEventListener('pointermove', e => { if (!down) return; const p = pos(e); wipe(p.x, p.y); });
const up = () => { down = false; last = null; };
c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);

let t0 = performance.now(), regrow = 0;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - t0) / 1000)); t0 = now;
  // at each shelter the bus slows, waits with the doors open, and goes on
  const stopAt = Math.min(W * 0.3, W * 0.72 - 210), D = 260; // keep the stop sign left of the pillar
  if (waiting > 0) {
    speed = 0; waiting -= dt;
  } else {
    let target = 1;
    for (const it of layers[1].items) {
      if (it.kind !== 'shelter' || it === leftStop) continue;
      const sx = ((it.x - travel * 0.35) % STREET + STREET) % STREET - 200;
      const dist = sx - stopAt;
      if (dist > 0 && dist < D) target = Math.min(target, Math.max(0.05, Math.sqrt(dist / D)));
      if (dist <= 0.5 && dist > -20) { waiting = 7; leftStop = it; target = 0; speed = 0; }
    }
    speed += (target - speed) * Math.min(1, dt * (target < speed ? 6 : 0.6));
  }
  travel += speed * dt * 140;

  drawTown(tq);
  // the fogged view: the town shrunk and stretched back (a blur), a wider halo, the grey of breath, the drops
  small.getContext('2d').drawImage(town, 0, 0, small.width, small.height);
  tiny.getContext('2d').drawImage(town, 0, 0, tiny.width, tiny.height);
  const v = view.getContext('2d');
  v.globalCompositeOperation = 'source-over'; v.globalAlpha = 1;
  v.drawImage(small, 0, 0, view.width, view.height);
  v.globalCompositeOperation = 'lighter'; v.globalAlpha = 0.7;
  v.drawImage(tiny, 0, 0, view.width, view.height);
  v.globalCompositeOperation = 'source-over'; v.globalAlpha = 1;
  v.fillStyle = 'rgba(70,78,96,0.28)'; v.fillRect(0, 0, view.width, view.height);
  v.drawImage(grain, 0, 0);
  v.globalCompositeOperation = 'destination-in';
  v.drawImage(fog, 0, 0);
  v.globalCompositeOperation = 'source-over';

  // breath and warmth: the fog creeps back
  regrow += dt;
  if (regrow > 0.1) { fq.save(); fq.globalAlpha = speed < 0.1 ? 0.014 : 0.008; fq.drawImage(fogBase, 0, 0, W, H);
    fq.globalCompositeOperation = 'destination-out'; fq.globalAlpha = 0.03; fq.drawImage(grease, 0, 0, W, H);
    fq.restore(); regrow = 0; }
  runDrops();

  screen.setTransform(1, 0, 0, 1, 0, 0);
  screen.drawImage(town, 0, 0);
  screen.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawReflection(screen);
  screen.setTransform(1, 0, 0, 1, 0, 0);
  screen.drawImage(view, 0, 0);
  screen.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawDrops(screen);
  drawFrame(screen);
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
buildTown(); resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
