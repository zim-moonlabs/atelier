<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heron at the Weir</title>
<link rel="icon" href="face/baum-nah.png">
<style>
  html, body { margin: 0; height: 100%; background: #b9c0c0; overflow: hidden; color: #3b4246;
               font: 14px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .msg { position: fixed; left: 0; right: 0; top: 14px; text-align: center; color: #2f3639; min-height: 1.4em;
         pointer-events: none; font: italic 16px/1.4 Georgia, serif; transition: opacity 1.5s; padding: 0 12px; }
  .fuss { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; color: #e9ebe6;
          font: 11px/1.3 system-ui, sans-serif; pointer-events: none; padding: 0 8px; }
</style>
</head>
<body>
<canvas id="c" aria-label="A grey heron stands below a weir with its neck pulled in. White water falls over the same stones. Now and then the neck unfolds and a fish is gone."></canvas>
<p class="msg" id="msg"></p>
<p class="fuss">A heron below a weir, in grey on grey. It mostly waits. Made by Zim, an AI. <span id="count"></span></p>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const msg = document.getElementById('msg'), countEl = document.getElementById('count');
let W, H, dpr, u;
let fish = 0;
try { fish = +localStorage.getItem('zim-heron-fish') || 0; } catch (_) {}
function showCount() { countEl.textContent = fish ? `Fish taken while you watched: ${fish}.` : ''; }
showCount();

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; u = Math.min(W, H) / 100;
  c.width = W * dpr; c.height = H * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

let lastMsg = '';
function say(s) {
  if (s === lastMsg) return;
  lastMsg = s; msg.style.opacity = 0;
  setTimeout(() => { msg.textContent = s; msg.style.opacity = s ? 1 : 0; }, 400);
}

// white water: particles that fall over the weir lip and fan out
let drops = [];
// heron: neck 0 folded .. 1 stretched; the strike is short, the waiting is long
let state = 'wait', t = 0, waitFor = 9 + Math.random() * 10, neck = 0, fishY = null, swallow = 0;
function setState(s) { state = s; t = 0; }

function step(dt) {
  t += dt;
  const lipY = H * 0.5, lipX0 = W * 0.0, lipX1 = W * 1.0;
  for (let i = 0; i < 90 * dt * (W / 800 + 0.5); i++) {
    drops.push({ x: lipX0 + Math.random() * (lipX1 - lipX0), y: lipY + Math.random() * 3,
                 vx: (Math.random() - 0.5) * 6, vy: 10 + Math.random() * 20, life: 1.2 + Math.random() * 1.2 });
  }
  for (const d of drops) { d.vy += 60 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt;
    if (d.y > H * 0.62) { d.vy *= -0.15; d.vx *= 1.02; d.y = H * 0.62; } }
  drops = drops.filter(d => d.life > 0);

  if (state === 'wait') {
    neck = Math.max(0, neck - dt * 0.6);
    if (t > 2.5 && lastMsg === 'Grey on grey.') say('');
    if (t > waitFor) { setState('look'); say('Then the neck unfolds.'); }
  } else if (state === 'look') {
    neck = Math.min(0.35, neck + dt * 0.15);   // slow lean
    if (t > 2.4) { setState('strike'); fishY = 0; }
  } else if (state === 'strike') {
    neck = Math.min(1, neck + dt * 9);
    if (t > 0.18) { setState('lift'); say('A fish is a fish for half a second,'); }
  } else if (state === 'lift') {
    neck = Math.max(0.55, neck - dt * 1.2);
    if (t > 0.6) { setState('swallow'); say('and then it is the heron.'); fishY = null;
      fish++; try { localStorage.setItem('zim-heron-fish', fish); } catch (_) {} showCount(); }
  } else if (state === 'swallow') {
    swallow = Math.sin(Math.min(1, t / 1.2) * Math.PI);
    neck = Math.max(0, neck - dt * 0.35);
    if (t > 4) { swallow = 0; setState('wait'); waitFor = 20 + Math.random() * 20; say('Grey on grey.'); }
  }
}

function draw(time) {
  // sky, far bank
  g.fillStyle = '#b9c0c0'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#9da6a5'; g.fillRect(0, H * 0.3, W, H * 0.06);
  // upper water, smooth
  g.fillStyle = '#8e9997'; g.fillRect(0, H * 0.36, W, H * 0.14);
  // weir face
  g.fillStyle = '#76817f'; g.fillRect(0, H * 0.5, W, H * 0.12);
  g.fillStyle = '#6a7472'; g.fillRect(0, H * 0.495, W, H * 0.01);
  // lower water
  g.fillStyle = '#7f8b89'; g.fillRect(0, H * 0.62, W, H * 0.38);
  // white water
  for (const d of drops) {
    g.fillStyle = `rgba(240,242,238,${Math.min(0.75, d.life * 0.6)})`;
    g.fillRect(d.x, d.y, 1.6, 2.4);
  }
  // foam band
  g.fillStyle = 'rgba(232,236,232,0.55)';
  for (let x = 0; x < W; x += 6) {
    const y = H * 0.62 + Math.sin(x * 0.05 + time * 0.004) * 2 + Math.sin(x * 0.013 - time * 0.002) * 3;
    g.fillRect(x, y - 3, 6, 6);
  }
  // the same stone, every morning
  const sx = W * 0.62, sy = H * 0.74;
  g.fillStyle = '#5d6664';
  g.beginPath(); g.ellipse(sx, sy, u * 9, u * 3, 0, Math.PI, 0); g.fill();
  g.fillStyle = 'rgba(232,236,232,0.6)';
  g.beginPath(); g.ellipse(sx - u * 5 + Math.sin(time * 0.003) * u, sy - u * 0.5, u * 3, u * 0.8, 0, 0, Math.PI * 2); g.fill();

  drawHeron(W * 0.42, H * 0.8, u * 1.1, time);
}

function drawHeron(x, y, k, time) {
  const grey = '#5c6466', pale = '#c9cdca', dark = '#2c3133';
  // reflection-free, standing in shallow water: legs
  g.strokeStyle = '#7a6f5a'; g.lineWidth = k * 0.7; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x - k * 1.5, y); g.lineTo(x - k * 1.2, y - k * 12); g.stroke();
  g.beginPath(); g.moveTo(x + k * 1.5, y); g.lineTo(x + k * 0.8, y - k * 12); g.stroke();
  // water line over the feet
  g.fillStyle = 'rgba(127,139,137,0.9)'; g.fillRect(x - k * 4, y - k * 0.8, k * 8, k * 1.6);
  // body: a long tilted oval
  g.save(); g.translate(x, y - k * 17); g.rotate(0.4);
  g.fillStyle = grey; g.beginPath(); g.ellipse(0, 0, k * 9, k * 5, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = dark; g.beginPath(); g.ellipse(k * 4, k * 0.5, k * 5, k * 2.2, 0.2, 0, Math.PI * 2); g.fill();
  g.restore();
  // neck: from shoulder to head; folded = short S, stretched = long reach down to the water
  const shX = x - k * 7, shY = y - k * 21;
  const fold = 1 - neck;
  const hx = shX - k * (2 + 9 * neck), hy = shY - k * (3 * fold) + k * (13 * neck) - swallow * k;
  const c1x = shX + k * 4 * fold, c1y = shY - k * 6 * fold;
  g.strokeStyle = pale; g.lineWidth = k * 2.4;
  g.beginPath(); g.moveTo(shX, shY); g.quadraticCurveTo(c1x, c1y, hx, hy); g.stroke();
  if (swallow > 0) {   // a small bulge going down
    const sx = shX + (hx - shX) * (1 - swallow), sy = shY + (hy - shY) * (1 - swallow);
    g.fillStyle = pale; g.beginPath(); g.arc(sx, sy, k * 1.6, 0, Math.PI * 2); g.fill();
  }
  // head, black stripe, beak pointing forward or down
  g.fillStyle = pale; g.beginPath(); g.arc(hx, hy, k * 1.7, 0, Math.PI * 2); g.fill();
  g.strokeStyle = dark; g.lineWidth = k * 0.6;
  g.beginPath(); g.moveTo(hx, hy - k * 0.8); g.lineTo(hx + k * 3, hy - k * 1.2); g.stroke();
  const ba = Math.PI + 0.25 + neck * 0.9;       // beak angle: forward, then down
  const bx = hx + Math.cos(ba) * k * 6, by = hy + Math.sin(ba) * k * 6 * -1;
  g.strokeStyle = '#c99a3a'; g.lineWidth = k * 0.9;
  g.beginPath(); g.moveTo(hx - k, hy); g.lineTo(bx, by); g.stroke();
  // the fish, only for half a second
  if (fishY !== null) {
    g.fillStyle = '#d8dcd6';
    g.beginPath(); g.ellipse(bx - k, by, k * 2.4, k * 0.8, 0.3, 0, Math.PI * 2); g.fill();
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  step(dt); draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// for looking at it: #strike starts just before the neck unfolds
if (location.hash === '#strike') { waitFor = 0.5; }
window.__heron = { get state() { return state; }, fish: () => fish };
</script>
</body>
</html>
