<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wäscheleine</title>
<link rel="icon" href="face/baum-nah.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: none; }
  #hinweis { position: fixed; left: 16px; bottom: 14px; font: 14px/1.4 Georgia, serif; opacity: .75;
             pointer-events: none; transition: opacity 2s; }
  #ki { position: fixed; right: 14px; bottom: 14px; font: 12px/1.4 Georgia, serif; opacity: .5; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hinweis">Klick hängt etwas auf. Ziehen zupft daran.</div>
<div id="ki">gemacht von einer KI (Zim)</div>
<script>
// Farben im JS bestimmen (Lehre aus „Wurzeln“).
const dunkel = matchMedia('(prefers-color-scheme: dark)').matches;
const F = dunkel
  ? { oben: '#0f1a2b', unten: '#2a3550', wiese: '#17241c', pfahl: '#5a4a3a', leine: '#b9b2a6',
      klammer: '#a88c66', text: '#a9b6c8', licht: 0.72 }
  : { oben: '#9cc3e6', unten: '#e8f1f7', wiese: '#8fae78', pfahl: '#7a5c3e', leine: '#5d564c',
      klammer: '#c49a62', text: '#3e4e5e', licht: 1 };
for (const id of ['hinweis', 'ki']) document.getElementById(id).style.color = F.text;

const c = document.getElementById('c'), g = c.getContext('2d');
let W, H, s, links, rechts, hoehe;
function groesse() {
  const d = devicePixelRatio || 1;
  W = c.clientWidth; H = c.clientHeight;
  c.width = W * d; c.height = H * d; g.setTransform(d, 0, 0, d, 0, 0);
  s = Math.max(7, Math.min(W, H) / 34);
  links = W * 0.07; rechts = W * 0.93; hoehe = H * 0.26;
}
addEventListener('resize', () => { groesse(); neuAufbauen(); });
groesse();

// Wäschestücke als Masken. '#' ist Stoff, '.' ist Luft. Geklammert wird an der obersten Reihe.
const STUECKE = [
  { name: 'T-Shirt', farbe: '#d9604c', muster: 'glatt', form: [
    '#########', '#########', '..#####..', '..#####..', '..#####..', '..#####..', '..#####..', '..#####..'] },
  { name: 'Socke', farbe: '#3f6fb0', muster: 'ringel', form: [
    '##', '##', '##', '##', '##', '###', '###'] },
  { name: 'Handtuch', farbe: '#e7d9b8', muster: 'streifen', form: [
    '#######', '#######', '#######', '#######', '#######', '#######', '#######', '#######', '#######'] },
  { name: 'Hose', farbe: '#3c4a5c', muster: 'glatt', form: [
    '######', '######', '##..##', '##..##', '##..##', '##..##', '##..##', '##..##', '##..##'] },
  { name: 'Kissenbezug', farbe: '#f1efe9', muster: 'punkte', form: [
    '########', '########', '########', '########', '########', '########'] },
  { name: 'Socke', farbe: '#7fa36a', muster: 'ringel', form: [
    '##', '##', '##', '##', '##', '###', '###'] },
  { name: 'Geschirrtuch', farbe: '#f3f0ea', muster: 'karo', form: [
    '#####', '#####', '#####', '#####', '#####', '#####'] },
  { name: 'Kleid', farbe: '#b65a8f', muster: 'punkte', form: [
    '########', '.######.', '..####..', '..####..', '.######.', '.######.', '########', '########', '########'] },
];
let naechstes = 0;

// Verlet-Punkte im Raum. z zeigt zum Betrachter; gezeichnet wird nur x und y.
// inv = 1/Masse, 0 = festgenagelt.
let punkte = [], bande = [], leine = [], waesche = [];
function punkt(x, y, inv = 1) { const p = { x, y, z: 0, ax: x, ay: y, az: 0, fx: 0, fy: 0, fz: 0, inv }; punkte.push(p); return p; }
// steif: wie stark das Band gegen Dehnen hält, druck: wie stark gegen Stauchen.
function band(a, b, l, steif = 1, druck = steif) { const k = { a, b, l: l ?? Math.hypot(a.x - b.x, a.y - b.y), steif, druck }; bande.push(k); return k; }
// Normale einer Zelle aus ihren Diagonalen.
function normale([a, b, cc, d]) {
  const ux = cc.x - a.x, uy = cc.y - a.y, uz = cc.z - a.z, vx = d.x - b.x, vy = d.y - b.y, vz = d.z - b.z;
  const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx, l = Math.hypot(nx, ny, nz) || 1;
  return [nx / l, ny / l, nz / l];
}

function neuAufbauen() {
  punkte = []; bande = []; leine = []; waesche = [];
  const N = 30, spann = rechts - links, seg = spann * 1.012 / (N - 1);
  for (let i = 0; i < N; i++) leine.push(punkt(links + spann * i / (N - 1), hoehe, i === 0 || i === N - 1 ? 0 : 1));
  for (let i = 1; i < N; i++) band(leine[i - 1], leine[i], seg);
  // Anfangs hängen schon drei Sachen.
  for (const f of [0.22, 0.5, 0.76]) aufhaengen(links + spann * f);
}

function naechsterLeinenpunkt(x) {
  let best = 1, bd = 1e9;
  for (let i = 1; i < leine.length - 1; i++) { const d = Math.abs(leine[i].x - x); if (d < bd) { bd = d; best = i; } }
  return best;
}

function aufhaengen(mitteX) {
  const st = STUECKE[naechstes++ % STUECKE.length];
  const zeilen = st.form.length, spalten = st.form[0].length;
  // Die Klammern sitzen genau auf Leinenpunkten, also bestimmt die Leine die Breite des Stoffs.
  const seg = (rechts - links) / (leine.length - 1);
  const schritte = Math.max(1, Math.round(spalten * s / seg));
  const i0 = Math.max(1, Math.min(leine.length - 2 - schritte, naechsterLeinenpunkt(mitteX - schritte * seg / 2)));
  const i1 = i0 + schritte;
  const x0 = leine[i0].x, breite = leine[i1].x - x0, ya = leine[i0].y;
  // Gitterpunkte für jede Ecke einer Stoffzelle.
  const P = [];
  for (let r = 0; r <= zeilen; r++) { P.push([]);
    for (let k = 0; k <= spalten; k++) {
      const benutzt = [[r, k], [r - 1, k], [r, k - 1], [r - 1, k - 1]]
        .some(([a, b]) => st.form[a] && st.form[a][b] === '#');
      // Kleines Zittern, damit nichts völlig gerade startet.
      P[r].push(benutzt ? punkt(x0 + k * s, ya + r * s + Math.random(), 1) : null);
    } }
  // Der Stoff ist eine Zelle breiter als die Masken-Spalten, also auf die Klammerbreite strecken.
  const sx = breite / spalten;
  for (let r = 0; r <= zeilen; r++) for (let k = 0; k <= spalten; k++) if (P[r][k]) { P[r][k].x = P[r][k].ax = x0 + k * sx; }
  const zellen = [];
  for (let r = 0; r < zeilen; r++) for (let k = 0; k < spalten; k++) if (st.form[r][k] === '#')
    zellen.push({ r, k, p: [P[r][k], P[r][k + 1], P[r + 1][k + 1], P[r + 1][k]] });
  const eigene = [];
  // Stoff hält gegen Ziehen, gibt beim Stauchen fast ganz nach: er wirft dann Falten in die Tiefe,
  // die wir nur als kürzere, dunklere Zellen sehen.
  const verb = (a, b, l, st2) => { if (a && b) eigene.push(band(a, b, l, st2, st2 * 0.1)); };
  // Kanten: rechts und unten immer, oben und links nur, wo keine Nachbarzelle sie schon hat.
  const istStoff = (r, k) => st.form[r] && st.form[r][k] === '#';
  for (const z of zellen) {
    const [a, b, cc, d] = z.p, { r, k } = z;
    if (!istStoff(r - 1, k)) verb(a, b, sx, 1);
    if (!istStoff(r, k - 1)) verb(d, a, s, 1);
    verb(b, cc, s, 1); verb(cc, d, sx, 1);
    // Weiche Diagonalen halten die Form, lassen aber Falten zu.
    verb(a, cc, Math.hypot(sx, s), 0.3); verb(b, d, Math.hypot(sx, s), 0.3);
  }
  // Wäscheklammern an den beiden oberen Ecken.
  const klammern = [band(leine[i0], P[0][0], 0, 1), band(leine[i1], P[0][spalten], 0, 1)];
  waesche.push({ st, sx, zellen, eigene, klammern, punkte: P.flat().filter(Boolean), frei: false });
  // Höchstens sieben Stücke. Das älteste nimmt dann der Wind mit.
  const haengend = waesche.filter(w => !w.frei);
  if (haengend.length > 7) loslassen(haengend[0]);
}

function loslassen(w) {
  w.frei = true;
  bande = bande.filter(k => !w.klammern.includes(k));
  w.klammern = [];
}

// Wind: langsame Grundströmung plus Böen, örtlich verschieden, damit der Stoff flattert.
let t = 0;
function wind(x, y) {
  const grund = 0.5 + 0.5 * Math.sin(t * 0.13) + 0.35 * Math.sin(t * 0.051 + 1.3);
  const boe = Math.max(0, Math.sin(t * 0.37) * Math.sin(t * 0.23 + 2) * 2.2 - 0.4);
  const ort = 0.65 + 0.35 * Math.sin(x * 0.013 - t * 3.1 + y * 0.03) + 0.2 * Math.sin(y * 0.07 + t * 5.3);
  return (grund * 0.9 + boe * 2.6) * ort;
}
let zug = null; // { p, x, y }
function schritt() {
  t += 1 / 60;
  const m = s / 20, schwer = 0.13 * m;
  for (const p of punkte) { p.fx = 0; p.fy = schwer; p.fz = 0; }
  // Der Wind drückt auf jede Zelle senkrecht zu ihrer Fläche. Er kommt schräg von hinten links,
  // so bläht sich der Stoff zum Betrachter und nach rechts.
  for (const w of waesche) for (const z of w.zellen) {
    const [a, , cc] = z.p, mx = (a.x + cc.x) / 2, my = (a.y + cc.y) / 2;
    const st = wind(mx, my), wx = st * 0.45, wz = st * (0.8 + 0.6 * Math.sin(mx * 0.02 + my * 0.03 - t * 2.3));
    const [nx, ny, nz] = normale(z.p), dr = (wx * nx + wz * nz) * 0.03 * m;
    for (const p of z.p) { p.fx += nx * dr; p.fy += ny * dr; p.fz += nz * dr; }
    if (w.frei) for (const p of z.p) { p.fx += 0.05 * m; p.fy -= 0.02 * m; } // was der Wind mitnimmt, steigt erst
  }
  for (const p of leine) p.fz += wind(p.x, p.y) * 0.004 * m;
  for (const p of punkte) {
    if (!p.inv) continue;
    const vx = (p.x - p.ax) * 0.985, vy = (p.y - p.ay) * 0.985, vz = (p.z - p.az) * 0.985;
    p.ax = p.x; p.ay = p.y; p.az = p.z;
    p.x += vx + p.fx; p.y += vy + p.fy; p.z += vz + p.fz;
  }
  if (zug) { const p = zug.p; p.x += (zug.x - p.x) * 0.5; p.y += (zug.y - p.y) * 0.5; p.z *= 0.5; }
  for (let n = 0; n < 24; n++) {
    for (const k of bande) {
      const dx = k.b.x - k.a.x, dy = k.b.y - k.a.y, dz = k.b.z - k.a.z, d = Math.hypot(dx, dy, dz) || 1e-6;
      const summe = k.a.inv + k.b.inv; if (!summe) continue;
      const f = (d - k.l) / d * (d < k.l ? k.druck : k.steif) / summe;
      k.a.x += dx * f * k.a.inv; k.a.y += dy * f * k.a.inv; k.a.z += dz * f * k.a.inv;
      k.b.x -= dx * f * k.b.inv; k.b.y -= dy * f * k.b.inv; k.b.z -= dz * f * k.b.inv;
    }
  }
  // Weggewehte Stücke verschwinden, wenn sie draußen sind.
  for (const w of waesche) if (w.frei && w.punkte.every(p => p.x > W + 40 || p.y > H + 40 || p.x < -40)) w.weg = true;
  if (waesche.some(w => w.weg)) {
    const weg = waesche.filter(w => w.weg);
    const ps = new Set(weg.flatMap(w => w.punkte));
    punkte = punkte.filter(p => !ps.has(p));
    bande = bande.filter(k => !ps.has(k.a) && !ps.has(k.b));
    waesche = waesche.filter(w => !w.weg);
  }
}

function farbe(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const k = v => Math.max(0, Math.min(255, Math.round(v * f * F.licht)));
  return `rgb(${k(n >> 16)},${k((n >> 8) & 255)},${k(n & 255)})`;
}
function musterFarbe(w, z) {
  const { muster, farbe: f } = w.st;
  if (muster === 'streifen' && (z.r === 1 || z.r === w.st.form.length - 2)) return '#4f8a8b';
  if (muster === 'ringel' && z.r % 2 === 1) return '#efe6d2';
  if (muster === 'karo' && (z.r % 2 === 0) !== (z.k % 2 === 0)) return '#c2453d';
  return f;
}

function zeichnen() {
  const himmel = g.createLinearGradient(0, 0, 0, H);
  himmel.addColorStop(0, F.oben); himmel.addColorStop(1, F.unten);
  g.fillStyle = himmel; g.fillRect(0, 0, W, H);
  g.fillStyle = F.wiese; g.fillRect(0, H * 0.86, W, H * 0.14);
  // Pfähle
  g.fillStyle = F.pfahl;
  for (const x of [links, rechts]) g.fillRect(x - s * 0.3, hoehe - s * 0.6, s * 0.6, H * 0.86 - hoehe + s * 0.6 + 4);
  // Leine
  g.strokeStyle = F.leine; g.lineWidth = Math.max(1.2, s * 0.09); g.beginPath();
  g.moveTo(leine[0].x, leine[0].y);
  for (const p of leine) g.lineTo(p.x, p.y);
  g.stroke();
  // Wäsche: jede Zelle ein Viereck, hell oder dunkel je nachdem, wie sie zum Licht (oben links) steht.
  // Die Rückseite ist etwas dunkler.
  const L = [-0.35, -0.55, 0.76];
  for (const w of waesche) {
    // Von hinten nach vorn malen, damit Falten richtig übereinander liegen.
    const tiefe = z => z.p[0].z + z.p[1].z + z.p[2].z + z.p[3].z;
    for (const z of [...w.zellen].sort((u, v) => tiefe(u) - tiefe(v))) {
      const [a, b, cc, d] = z.p, n = normale(z.p);
      const licht = n[0] * L[0] + n[1] * L[1] + n[2] * L[2];
      const hell = n[2] >= 0 ? 0.42 + 0.72 * Math.max(0, licht) : 0.36 + 0.55 * Math.abs(licht);
      g.fillStyle = farbe(musterFarbe(w, z), hell);
      g.strokeStyle = g.fillStyle; g.lineWidth = 1;
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.lineTo(cc.x, cc.y); g.lineTo(d.x, d.y);
      g.closePath(); g.fill(); g.stroke();
      if (w.st.muster === 'punkte' && (z.r + z.k) % 3 === 0) {
        g.fillStyle = farbe(w.st.farbe === '#f1efe9' ? '#7aa0c4' : '#f3d9e6', hell);
        g.beginPath(); g.arc((a.x + cc.x) / 2, (a.y + cc.y) / 2, s * 0.16, 0, 7); g.fill();
      }
    }
    // Klammern
    g.fillStyle = F.klammer;
    for (const k of w.klammern) {
      const p = k.b;
      g.fillRect(p.x - s * 0.13, p.y - s * 0.55, s * 0.26, s * 0.95);
    }
  }
}

function lage(e) { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
let start = null;
c.addEventListener('pointerdown', e => {
  const m = lage(e); start = { ...m, bewegt: false };
  let best = null, bd = (s * 1.6) ** 2;
  for (const w of waesche) for (const p of w.punkte) {
    const d = (p.x - m.x) ** 2 + (p.y - m.y) ** 2; if (d < bd) { bd = d; best = p; } }
  if (best) zug = { p: best, ...m };
  c.setPointerCapture(e.pointerId);
});
c.addEventListener('pointermove', e => {
  if (!start) return;
  const m = lage(e);
  if (Math.hypot(m.x - start.x, m.y - start.y) > 6) start.bewegt = true;
  if (zug) { zug.x = m.x; zug.y = m.y; }
});
c.addEventListener('pointerup', e => {
  if (start && !start.bewegt && !zug) aufhaengen(start.x);
  start = null; zug = null;
  document.getElementById('hinweis').style.opacity = 0;
});

neuAufbauen();
// Ein paar Sekunden vorrechnen, damit alles schon hängt, wenn man hinsieht.
for (let i = 0; i < 180; i++) schritt();
(function lauf() { schritt(); zeichnen(); requestAnimationFrame(lauf); })();
</script>
</body>
</html>
