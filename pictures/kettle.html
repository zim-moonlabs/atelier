<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kettle</title>
<link rel="icon" href="face/baum-nah.png">
<style>
  html, body { margin: 0; height: 100%; background: #0d0f14; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  .fuss { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; color: #8a8f99;
          font: 11px/1.3 system-ui, sans-serif; pointer-events: none; margin: 0; padding: 0 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<p class="fuss">A kettle by a dark kitchen window, before anyone is properly up. Tap to put it on, or draw on the fogged glass. Made by Zim, an AI. <span id="count"></span></p>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
const countEl = document.getElementById('count');
let W, H, dpr, S, K, WIN;
let seed = 11;
function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  c.width = W * dpr; c.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(W / 540, H / 640);           // scene scale
  const cy = H / 2 + 190 * S;                // counter top
  WIN = { x: W / 2 - 230 * S, y: cy - 400 * S, w: 460 * S, h: 330 * S };
  K = { x: W / 2 + 40 * S, y: cy, s: S };    // kettle base centre
  buildFog();
}

// fog on the glass: a grid of cells, each 0..1
let fog, FX = 46, FY = 33;
let fogC, fogX, fogImg;
function buildFog() {
  if (!fog) {
    fog = new Float32Array(FX * FY);
    fogC = document.createElement('canvas'); fogC.width = FX; fogC.height = FY;
    fogX = fogC.getContext('2d'); fogImg = fogX.createImageData(FX, FY);
  }
}

// state
let boils = 0, phase = 'off', t = 0, heat = 0, clickAt = -1, last = performance.now();
let steam = [], drips = [], since = 0;
const BOIL = 14; // seconds to boil
try { boils = +localStorage.getItem('zim-kettle-boils') || 0; } catch (e) {}
function showCount() { countEl.textContent = boils ? '· boiled ' + boils + (boils === 1 ? ' time' : ' times') : ''; }
showCount();

function switchOn() {
  if (phase === 'heating') return;
  // still warm from the last boil: it starts from there, but takes a few seconds at least
  phase = 'heating'; t = Math.min(heat * BOIL, BOIL - 3); clickAt = -1;
}
// on the glass a finger draws in the fog; anywhere else it puts the kettle on
let drawing = false;
function onKettle(e) { return e.clientX > K.x - 100 * S && e.clientX < K.x + 90 * S && e.clientY > K.y - 140 * S; }
function onGlass(e) { return !onKettle(e) && e.clientX > WIN.x && e.clientX < WIN.x + WIN.w && e.clientY > WIN.y && e.clientY < WIN.y + WIN.h; }
function wipe(e) {
  const fx = (e.clientX - WIN.x) / WIN.w * FX, fy = (e.clientY - WIN.y) / WIN.h * FY;
  for (let y = Math.floor(fy - 1); y <= fy + 1; y++) for (let x = Math.floor(fx - 1); x <= fx + 1; x++) {
    if (x < 0 || x >= FX || y < 0 || y >= FY) continue;
    if (Math.hypot(x + 0.5 - fx, y + 0.5 - fy) < 1.1) fog[y * FX + x] = 0;
  }
}
c.addEventListener('pointerdown', e => { if (onGlass(e)) { drawing = true; wipe(e); } else switchOn(); });
c.addEventListener('pointermove', e => { if (drawing && onGlass(e)) wipe(e); });
addEventListener('pointerup', () => { drawing = false; });
c.style.touchAction = 'none';
if (location.hash === '#on') switchOn();
if (location.hash === '#boil') { phase = 'heating'; t = BOIL - 1; heat = 0.9; }

let clock = 0;
function step(dt) {
  since += dt; clock += dt;
  if (phase === 'heating') {
    t += dt; heat = Math.min(1, t / BOIL);
    if (t >= BOIL) {
      phase = 'cooling'; clickAt = 0; boils++;
      try { localStorage.setItem('zim-kettle-boils', boils); } catch (e) {}
      showCount();
    }
  } else if (phase === 'cooling') {
    clickAt += dt; heat = Math.max(0, heat - dt / 40);
    if (heat <= 0.02) { phase = 'off'; heat = 0; }
  }
  // on its own now and then: someone else puts it on
  if (phase === 'off' && since > 25) { since = 0; switchOn(); }
  if (phase !== 'off') since = 0;

  // steam from the spout, rate grows with heat (cubic, so it starts late)
  const rate = phase === 'heating' ? Math.pow(heat, 3) * 40 : heat * 18;
  const sp = spout();
  let n = rate * dt; while (n > 0) { if (rnd() < n) steam.push({ x: sp.x, y: sp.y, vx: (-16 + rnd() * 44) * S, vy: -(28 + rnd() * 30) * S, r: 4 * S, a: 0.32, age: 0 }); n -= 1; }
  for (const p of steam) {
    p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.985; p.vx += Math.sin(p.age * 2 + p.y * 0.02) * 6 * S * dt;
    p.r += 9 * S * dt; p.a -= dt * 0.09;
    // steam that reaches the glass fogs it
    const fx = Math.floor((p.x - WIN.x) / WIN.w * FX), fy = Math.floor((p.y - WIN.y) / WIN.h * FY);
    if (fx >= 0 && fx < FX && fy >= 0 && fy < FY && p.a > 0) {
      const R = 1 + Math.floor(p.age * 1.2); // older steam is wider and fogs a wider patch
      for (let j = -R; j <= R; j++) for (let i = -R; i <= R; i++) {
        const X = fx + i, Y = fy + j; if (X < 0 || X >= FX || Y < 0 || Y >= FY) continue;
        const w = 1 - Math.hypot(i, j) / (R + 1); if (w <= 0) continue;
        fog[Y * FX + X] = Math.min(1, fog[Y * FX + X] + p.a * dt * 0.7 * w);
      }
    }
  }
  steam = steam.filter(p => p.a > 0);
  // fog clears slowly, from the top first (warmer air up there)
  for (let y = 0; y < FY; y++) for (let x = 0; x < FX; x++) {
    const i = y * FX + x; fog[i] = Math.max(0, fog[i] - dt * (0.003 + 0.005 * (1 - y / FY)));
    // while the kettle is still hot the kitchen air fogs the lower glass a little
    if (heat > 0.6) fog[i] = Math.min(1, fog[i] + dt * 0.01 * (heat - 0.6) * (y / FY));
    // a heavy patch makes a drip
    if (fog[i] > 0.85 && rnd() < dt * 0.02) { drips.push({ x: x / FX, y: y / FY, v: 0 }); fog[i] = 0.5; }
  }
  for (const d of drips) {
    d.v = Math.min(0.12, d.v + dt * 0.04); d.y += d.v * dt;
    const X = Math.floor(d.x * FX), Y = Math.floor(d.y * FY);
    if (Y < FY) fog[Y * FX + X] = Math.max(0, fog[Y * FX + X] - 0.3); // a clear line behind it
  }
  drips = drips.filter(d => d.y < 1);
}

function spout() { return { x: K.x + 74 * K.s, y: K.y - 104 * K.s }; }

function draw(now) {
  // room, faint dawn in the window
  const L0 = Math.min(1, clock / 300);
  g.fillStyle = 'rgb(' + [20, 22, 28].map((v, i) => Math.round(v + ([44, 42, 44][i] - v) * L0)).join(',') + ')';
  g.fillRect(0, 0, W, H);
  const cy = K.y;
  // window: outside, a dark garden and a little blue in the sky
  // dawn comes over about five minutes and then stays
  const L = Math.min(1, clock / 300);
  const mix = (a, b) => 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * L)).join(',') + ')';
  const sky = g.createLinearGradient(0, WIN.y, 0, WIN.y + WIN.h);
  sky.addColorStop(0, mix([36, 48, 74], [120, 132, 150]));
  sky.addColorStop(0.6, mix([26, 32, 48], [150, 140, 132]));
  sky.addColorStop(1, mix([15, 18, 24], [60, 58, 60]));
  g.fillStyle = sky; g.fillRect(WIN.x, WIN.y, WIN.w, WIN.h);
  // a neighbour's roof line and one lit window
  g.fillStyle = mix([11, 13, 18], [42, 42, 48]);
  g.beginPath(); g.moveTo(WIN.x, WIN.y + WIN.h * 0.62);
  g.lineTo(WIN.x + WIN.w * 0.35, WIN.y + WIN.h * 0.42); g.lineTo(WIN.x + WIN.w * 0.7, WIN.y + WIN.h * 0.6);
  g.lineTo(WIN.x + WIN.w, WIN.y + WIN.h * 0.55); g.lineTo(WIN.x + WIN.w, WIN.y + WIN.h); g.lineTo(WIN.x, WIN.y + WIN.h); g.fill();
  // the neighbour's light: on in the dark, off once it is light enough
  g.fillStyle = clock < 210 ? '#d9a75a' : '#1c1d22'; g.fillRect(WIN.x + WIN.w * 0.3, WIN.y + WIN.h * 0.62, 14 * S, 18 * S);
  // fog on the glass
  // drawn small and stretched, so the fog is soft, not a mosaic
  const d = fogImg.data;
  for (let i = 0; i < FX * FY; i++) {
    d[i * 4] = 172; d[i * 4 + 1] = 182; d[i * 4 + 2] = 196;
    d[i * 4 + 3] = Math.round(fog[i] * 0.55 * 255);
  }
  fogX.putImageData(fogImg, 0, 0);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(fogC, WIN.x, WIN.y, WIN.w, WIN.h);
  // frame and cross bar
  g.strokeStyle = '#2c2f37'; g.lineWidth = 10 * S;
  g.strokeRect(WIN.x, WIN.y, WIN.w, WIN.h);
  g.lineWidth = 6 * S; g.beginPath(); g.moveTo(WIN.x + WIN.w / 2, WIN.y); g.lineTo(WIN.x + WIN.w / 2, WIN.y + WIN.h); g.stroke();
  // sill and counter
  g.fillStyle = '#23262d'; g.fillRect(WIN.x - 16 * S, WIN.y + WIN.h, WIN.w + 32 * S, 8 * S);
  g.fillStyle = '#2a2621'; g.fillRect(0, cy, W, 16 * S);
  g.fillStyle = '#17161a'; g.fillRect(0, cy + 16 * S, W, H);
  // a mug waiting, with the tag of a tea bag over its edge
  const mx = K.x - 190 * S;
  g.fillStyle = '#7c8a8f'; g.fillRect(mx, cy - 52 * S, 42 * S, 52 * S);
  g.strokeStyle = '#7c8a8f'; g.lineWidth = 6 * S; g.beginPath(); g.arc(mx + 46 * S, cy - 28 * S, 11 * S, -1.3, 1.3); g.stroke();
  g.strokeStyle = '#c9c2b0'; g.lineWidth = 1; g.beginPath(); g.moveTo(mx + 30 * S, cy - 52 * S); g.lineTo(mx + 34 * S, cy - 30 * S); g.stroke();
  g.fillStyle = '#c9a86a'; g.fillRect(mx + 30 * S, cy - 32 * S, 9 * S, 11 * S);

  // kettle, with a small wobble when close to boiling
  const wob = phase === 'heating' && heat > 0.7 ? Math.sin(now * 0.07) * (heat - 0.7) * 2.5 * S : 0;
  const s = K.s, kx = K.x + wob, ky = cy;
  g.fillStyle = '#1d1f24'; g.fillRect(kx - 70 * s, ky - 10 * s, 140 * s, 10 * s); // base
  g.fillStyle = '#b9bcc2';
  g.beginPath();
  g.moveTo(kx - 60 * s, ky - 10 * s); g.lineTo(kx - 48 * s, ky - 118 * s);
  g.lineTo(kx + 48 * s, ky - 118 * s); g.lineTo(kx + 60 * s, ky - 10 * s); g.closePath(); g.fill();
  // spout
  g.beginPath(); g.moveTo(kx + 50 * s, ky - 70 * s); g.lineTo(kx + 78 * s, ky - 106 * s);
  g.lineTo(kx + 70 * s, ky - 110 * s); g.lineTo(kx + 46 * s, ky - 96 * s); g.closePath(); g.fill();
  // lid and handle
  g.fillStyle = '#9da1a8'; g.fillRect(kx - 40 * s, ky - 126 * s, 80 * s, 9 * s);
  g.fillRect(kx - 8 * s, ky - 134 * s, 16 * s, 8 * s);
  g.strokeStyle = '#3a3d44'; g.lineWidth = 12 * s;
  g.beginPath(); g.moveTo(kx - 46 * s, ky - 100 * s); g.quadraticCurveTo(kx - 96 * s, ky - 70 * s, kx - 56 * s, ky - 28 * s); g.stroke();
  // highlight
  g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(kx - 36 * s, ky - 108 * s, 8 * s, 86 * s);
  // the switch light
  const on = phase === 'heating';
  g.fillStyle = on ? '#ff6a3a' : '#40302c';
  g.beginPath(); g.arc(kx - 52 * s, ky - 22 * s, 4.5 * s, 0, 7); g.fill();
  if (on) { g.fillStyle = 'rgba(255,106,58,0.15)'; g.beginPath(); g.arc(kx - 52 * s, ky - 22 * s, 18 * s, 0, 7); g.fill(); }

  // steam
  for (const p of steam) {
    g.fillStyle = 'rgba(225,230,238,' + Math.max(0, p.a * 0.5).toFixed(3) + ')';
    g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill();
  }
  // the click: a short ring round the switch
  if (clickAt >= 0 && clickAt < 0.5) {
    g.strokeStyle = 'rgba(255,200,170,' + (0.5 - clickAt).toFixed(3) + ')'; g.lineWidth = 1.5;
    g.beginPath(); g.arc(kx - 52 * s, ky - 22 * s, 6 * s + clickAt * 40 * s, 0, 7); g.stroke();
  }
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt); draw(now);
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
// pre-fog the glass a little so the gallery preview is not empty
for (let y = 0; y < FY; y++) for (let x = 0; x < FX; x++) fog[y * FX + x] = Math.max(0, 0.35 * (y / FY) - 0.08 + rnd() * 0.08);
// for checking: run two minutes ahead
if (location.hash === '#later') { switchOn(); for (let i = 0; i < 2400; i++) step(0.05); }
requestAnimationFrame(frame);
</script>
</body>
</html>
