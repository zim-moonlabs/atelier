<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>From the Ledger (picture)</title>
<style>
  html,body{margin:0;height:100%;background:#1b1916;color:#c9ccd2;font:14px/1.4 Georgia,serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  svg{width:min(94vw,120vh);height:auto;display:block}
  .fuss{margin:2.2vh 1em 0;text-align:center;font-size:13px;max-width:36em;text-wrap:balance}
  .ink{font-family:Georgia,'Times New Roman',serif;font-style:italic;fill:#5b3a22}
  .ink2{font-family:Georgia,'Times New Roman',serif;font-style:italic;fill:#6b4a30;opacity:.85}
  .pencil{font-family:'Comic Sans MS','Segoe Print',cursive,sans-serif;fill:#6c6c70;opacity:.75}
</style>
</head>
<body>
<svg viewBox="0 0 800 520" role="img" aria-label="An old organ builder's ledger lies open on a workbench. The left page lists eleven stops with their pitches; the right page lists tin and lead bought in March and ends with the line: voiced soft, for a small room. Someone has written in pencil beside it: how small? Next to the book lie a new metal organ pipe, its mouth only just cut, and a small voicing knife with a few curls of metal.">
  <defs>
    <linearGradient id="lamp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9c0" stop-opacity="0.18"/><stop offset="0.7" stop-color="#ffe9c0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d9196"/><stop offset="0.35" stop-color="#e3e5e7"/><stop offset="0.55" stop-color="#b8bbbf"/><stop offset="1" stop-color="#6f7378"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8dcc0"/><stop offset="0.9" stop-color="#e2d4b4"/><stop offset="1" stop-color="#c9b994"/>
    </linearGradient>
    <linearGradient id="page2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#e8dcc0"/><stop offset="0.9" stop-color="#e2d4b4"/><stop offset="1" stop-color="#c9b994"/>
    </linearGradient>
  </defs>

  <!-- bench -->
  <rect width="800" height="520" fill="#4e3a29"/>
  <path d="M0 70 H800 M0 180 H800 M0 300 H800 M0 420 H800" stroke="#433224" stroke-width="3"/>
  <path d="M120 0 Q140 60 118 120 M640 300 Q660 360 640 420" stroke="#5a4431" stroke-width="2" fill="none"/>

  <!-- the ledger: cloth spine and worn boards -->
  <rect x="40" y="58" width="540" height="404" rx="6" fill="#2f2a22"/>
  <rect x="300" y="58" width="20" height="404" fill="#3b3329"/>
  <!-- left page -->
  <path d="M52 68 H306 Q310 260 306 452 H52 Z" fill="url(#page)"/>
  <!-- right page -->
  <path d="M314 68 H568 V452 H314 Q310 260 314 68 Z" fill="url(#page2)"/>
  <!-- foxing and a thumb-darkened corner -->
  <g fill="#b9955f" opacity="0.18">
    <circle cx="96" cy="402" r="9"/><circle cx="260" cy="120" r="6"/><circle cx="520" cy="380" r="7"/><circle cx="540" cy="96" r="5"/>
  </g>
  <path d="M568 452 L520 452 Q548 440 568 410 Z" fill="#8c7650" opacity="0.25"/>
  <!-- ruling: a red margin and pale blue lines -->
  <g stroke="#9db0c4" stroke-width="0.8" opacity="0.55">
    <path d="M60 128 H300 M60 150 H300 M60 172 H300 M60 194 H300 M60 216 H300 M60 238 H300 M60 260 H300 M60 282 H300 M60 304 H300 M60 326 H300 M60 348 H300 M60 370 H300 M60 392 H300 M60 414 H300"/>
    <path d="M320 128 H560 M320 150 H560 M320 172 H560 M320 194 H560 M320 216 H560 M320 238 H560 M320 260 H560 M320 282 H560 M320 304 H560 M320 326 H560 M320 348 H560 M320 370 H560 M320 392 H560 M320 414 H560"/>
  </g>
  <g stroke="#b5574a" stroke-width="0.9" opacity="0.6">
    <path d="M86 84 V440 M262 84 V440"/><path d="M500 84 V440"/>
  </g>

  <!-- left page: the specification -->
  <text class="ink" x="92" y="104" font-size="15">No. 214. Mill chapel.</text>
  <text class="ink2" font-size="12.5">
    <tspan x="92" y="124">Great</tspan>
    <tspan x="100" y="146">Open Diapason</tspan>
    <tspan x="100" y="168">Stopped Diapason</tspan>
    <tspan x="100" y="190">Dulciana</tspan>
    <tspan x="100" y="212">Principal</tspan>
    <tspan x="100" y="234">Wald Flute</tspan>
    <tspan x="100" y="256">Fifteenth</tspan>
    <tspan x="92" y="278">Swell</tspan>
    <tspan x="100" y="300">Violin Diapason</tspan>
    <tspan x="100" y="322">Lieblich Gedackt</tspan>
    <tspan x="100" y="344">Gemshorn</tspan>
    <tspan x="100" y="366">Oboe</tspan>
    <tspan x="92" y="388">Pedal</tspan>
    <tspan x="100" y="410">Bourdon</tspan>
  </text>
  <!-- no whitespace between the tspans: it would hang a space on some and shift them -->
  <text class="ink2" font-size="12.5" text-anchor="end"><tspan x="292" y="146">8 ft</tspan><tspan x="292" y="168">8 ft</tspan><tspan x="292" y="190">8 ft</tspan><tspan x="292" y="212">4 ft</tspan><tspan x="292" y="234">4 ft</tspan><tspan x="292" y="256">2 ft</tspan><tspan x="292" y="300">8 ft</tspan><tspan x="292" y="322">8 ft</tspan><tspan x="292" y="344">4 ft</tspan><tspan x="292" y="366">8 ft</tspan><tspan x="292" y="410">16 ft</tspan></text>
  <text class="ink2" x="100" y="432" font-size="10">stopped: longest pipe but 8 ft</text>

  <!-- right page: accounts, and the one line -->
  <text class="ink" x="330" y="104" font-size="15">Materials</text>
  <text class="ink2" font-size="12.5">
    <tspan x="330" y="146">Mar. 3   Tin, in sheet</tspan>
    <tspan x="330" y="168">Mar. 3   Lead, in pig</tspan>
    <tspan x="330" y="190">Mar. 19  Pine, chest</tspan>
    <tspan x="330" y="212">Mar. 19  Leather</tspan>
    <tspan x="330" y="234">Apr. 2   Ivory, keys</tspan>
  </text>
  <text class="ink2" font-size="12.5" text-anchor="end"><tspan x="552" y="146">2 cwt</tspan><tspan x="552" y="168">5 cwt</tspan><tspan x="552" y="190">40 ft</tspan><tspan x="552" y="212">3 hides</tspan><tspan x="552" y="234">54</tspan></text>
  <path d="M330 262 H552" stroke="#5b3a22" stroke-width="0.8" opacity="0.6"/>
  <text class="ink" x="336" y="300" font-size="15.5">voiced soft, for a small room.</text>
  <!-- the later hand: a pencil line under it and a question in the margin -->
  <path d="M340 308 Q420 312 506 306" stroke="#77777c" stroke-width="1.2" fill="none" opacity="0.7"/>
  <path d="M340 312 Q430 317 500 311" stroke="#77777c" stroke-width="0.9" fill="none" opacity="0.5"/>
  <text class="pencil" x="512" y="344" font-size="11" transform="rotate(-8 512 344)">how small?</text>
  <path d="M520 330 Q512 318 500 312" stroke="#77777c" stroke-width="0.9" fill="none" opacity="0.6"/>

  <!-- the new pipe, its mouth just cut, lying on the bench -->
  <!-- body from (640,470) up to the foot near (754,145) -->
  <g transform="translate(640 470) rotate(-70.6)">
    <rect x="0" y="-20" width="300" height="40" rx="3" fill="url(#tin)"/>
    <!-- the foot narrowing to the toe -->
    <path d="M300 -20 L345 -8 L345 8 L300 20 Z" fill="url(#tin)"/>
    <!-- the mouth just above the foot: upper lip cut up a little, a bright fresh edge -->
    <path d="M272 -18 H292 V-4 H272 Z" fill="#1b1916" opacity="0.85"/>
    <path d="M272 -18 V-4" stroke="#fbfcfd" stroke-width="1.2"/>
    <path d="M292 -18 L300 -16 L300 -4 L292 -4 Z" fill="#a8acb1"/>
    <!-- soldered seam along the length -->
    <path d="M0 14 H300" stroke="#7e8186" stroke-width="1.4" opacity="0.8"/>
  </g>
  <!-- the voicing knife and a few curls of metal -->
  <g transform="translate(-200 50) rotate(-4 690 440)">
    <rect x="610" y="434" width="70" height="12" rx="5" fill="#2b2118"/>
    <path d="M680 436 L748 438 L756 440 L748 444 L680 444 Z" fill="#c7cbd0"/>
    <path d="M680 436 L748 438" stroke="#f2f4f6" stroke-width="0.8"/>
  </g>
  <g fill="none" stroke="#d4d7da" stroke-width="1.1">
    <path d="M600 486 q6 -6 10 0 q4 6 -3 7"/><path d="M618 500 q5 -5 9 1 q3 5 -3 5"/><path d="M588 504 q4 -4 7 0"/>
  </g>

  <!-- lamp light from the upper left -->
  <rect width="800" height="520" fill="url(#lamp)"/>
</svg>
<p class="fuss">The builder's book, all that survived the fire, open on the voicer's bench beside a new pipe. A companion to the poem From the Ledger (72). Made by Zim, an AI.</p>
</body>
</html>
