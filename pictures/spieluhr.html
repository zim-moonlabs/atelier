<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spieluhr</title>
<link rel="icon" href="face/baum-nah.png">
<style>
  html, body { margin: 0; height: 100%; background: #17110c; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: manipulation; }
  .leiste { position: fixed; left: 0; right: 0; bottom: 14px; text-align: center;
            font: 14px/1.4 Georgia, serif; color: #a8916f; pointer-events: none; padding: 0 16px; }
  .leiste button { pointer-events: auto; font: inherit; color: #e9d3a6; background: #2a1f15;
                   border: 1px solid #4a3826; border-radius: 4px; padding: 3px 12px; margin: 0 4px; cursor: pointer; }
  .leiste button:hover { border-color: #c9a35f; }
  .leiste p { margin: 6px 0 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="leiste">
  <button id="halt">Anhalten</button><button id="leer">Leeren</button><button id="neu">Meine Melodie</button>
  <p>Klick setzt oder zieht einen Stift. Innen tief, außen hoch. Die Adresse merkt sich die Melodie.</p>
</div>
<script>
// Eine Walze mit 16 Schritten und 8 Tönen (D-Dur-Pentatonik, wie Regen und Leuchtturm).
const STEPS = 16, TONES = 8;
const FREQ = [293.66, 329.63, 369.99, 440.00, 493.88, 587.33, 659.25, 739.99];
// Meine eigene kleine Melodie: [Schritt, Ton]
const MEINE = [[0,5],[0,0],[2,7],[4,6],[4,3],[6,5],[8,4],[8,1],[10,3],[12,4],[12,2],[13,5],[14,3]];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let pins = [], phase = 0, last = -1, running = true, tempo = 3.2; // Schritte pro Sekunde
const flash = new Array(TONES).fill(0);

function leer() { pins = Array.from({length: STEPS}, () => new Array(TONES).fill(false)); }
function meine() { leer(); for (const [s, t] of MEINE) pins[s][t] = true; }

// Melodie <-> Adresse: pro Ton vier Hex-Ziffern (16 Bit, ein Bit je Schritt)
function encode() {
  let out = '';
  for (let t = 0; t < TONES; t++) {
    let bits = 0; for (let s = 0; s < STEPS; s++) if (pins[s][t]) bits |= 1 << s;
    out += bits.toString(16).padStart(4, '0');
  }
  return out;
}
function decode(h) {
  if (!/^[0-9a-f]{32}$/.test(h)) return false;
  leer();
  for (let t = 0; t < TONES; t++) {
    const bits = parseInt(h.slice(t * 4, t * 4 + 4), 16);
    for (let s = 0; s < STEPS; s++) pins[s][t] = !!(bits & (1 << s));
  }
  return true;
}
function merken() { try { history.replaceState(null, '', '#' + encode()); } catch (e) {} }

if (!decode(location.hash.slice(1))) meine();

// Ton: Grundton plus ein kurzer, hoher Teilton, wie eine angerissene Metallzunge
let ac = null, out = null;
function audio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    out = ac.createGain(); out.gain.value = 0.22;
    const dl = ac.createDelay(), fb = ac.createGain(), wet = ac.createGain();
    dl.delayTime.value = 0.23; fb.gain.value = 0.32; wet.gain.value = 0.28;
    out.connect(ac.destination); out.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(ac.destination);
  } catch (e) { ac = null; }
}
function zupf(f) {
  if (!ac || ac.state !== 'running') return;
  const t = ac.currentTime;
  for (const [mul, vol, dur] of [[1, 0.5, 1.8], [4.07, 0.12, 0.35]]) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = f * mul;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.05);
  }
}

let W, H, cx, cy, R, r0, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H / 2 - 24; R = Math.max(60, Math.min(W, H - 110) * 0.44); r0 = R * 0.34;
}
addEventListener('resize', resize); resize();

const ringR = t => r0 + (R - r0) * (t + 0.5) / TONES;
const stepA = s => -Math.PI / 2 + (s - phase) * 2 * Math.PI / STEPS;

function draw() {
  ctx.clearRect(0, 0, W, H);
  // Walze
  const g = ctx.createRadialGradient(cx, cy, r0 * 0.5, cx, cy, R * 1.08);
  g.addColorStop(0, '#3b2a1a'); g.addColorStop(0.8, '#2a1d12'); g.addColorStop(1, '#1d140d');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 1.04, 0, 7); ctx.fill();
  ctx.fillStyle = '#17110c'; ctx.beginPath(); ctx.arc(cx, cy, r0 * 0.82, 0, 7); ctx.fill();
  ctx.strokeStyle = '#4a3826'; ctx.lineWidth = 1;
  for (let t = 0; t <= TONES; t++) { ctx.beginPath(); ctx.arc(cx, cy, r0 + (R - r0) * t / TONES, 0, 7); ctx.stroke(); }
  // Stifte und leere Löcher
  const dot = (R - r0) / TONES * 0.28;
  for (let s = 0; s < STEPS; s++) {
    const a = stepA(s), ca = Math.cos(a), sa = Math.sin(a);
    for (let t = 0; t < TONES; t++) {
      const r = ringR(t), x = cx + ca * r, y = cy + sa * r;
      ctx.beginPath();
      if (pins[s][t]) {
        ctx.arc(x, y, dot, 0, 7); ctx.fillStyle = '#e2bd72'; ctx.fill();
        ctx.beginPath(); ctx.arc(x - dot * 0.3, y - dot * 0.3, dot * 0.35, 0, 7); ctx.fillStyle = '#fff1cc'; ctx.fill();
      } else {
        ctx.arc(x, y, dot * 0.32, 0, 7); ctx.fillStyle = '#4e3b27'; ctx.fill();
      }
    }
  }
  // Der Kamm oben (2026-11-20 neu gebaut): eine Stahlplatte, die Zungen sind
  // ihre Zähne. Tiefe Zungen (innen) sind länger, alle Spitzen enden auf der
  // Linie, über die die Stifte laufen. Beim Anreißen hebt sich die Spitze.
  const cell = (R - r0) / TONES, tipX = cx - dot * 0.9;
  const rootX = t => tipX - R * (0.42 - 0.17 * t / (TONES - 1));
  const yTop = cy - R - cell * 0.15, yBot = cy - r0 + cell * 0.15;
  const back = R * 0.12;
  // Schatten der Platte auf der Scheibe
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.moveTo(rootX(TONES - 1) - back + 4, yTop + 5); ctx.lineTo(rootX(TONES - 1) + 4, yTop + 5);
  ctx.lineTo(rootX(0) + 4, yBot + 5); ctx.lineTo(rootX(0) - back + 4, yBot + 5); ctx.fill();
  // Zähne
  for (let t = 0; t < TONES; t++) {
    const f = flash[t], lift = f * cell * 0.18;
    const y = cy - ringR(t), x0 = rootX(t), w0 = cell * 0.36, w1 = cell * 0.2;
    const tg = ctx.createLinearGradient(0, y - w0 / 2, 0, y + w0 / 2);
    tg.addColorStop(0, `rgb(${196 + 50 * f}, ${190 + 45 * f}, ${176 + 30 * f})`);
    tg.addColorStop(0.5, `rgb(${150 + 90 * f}, ${146 + 80 * f}, ${136 + 50 * f})`);
    tg.addColorStop(1, `rgb(${92 + 70 * f}, ${88 + 60 * f}, ${82 + 40 * f})`);
    ctx.fillStyle = tg; ctx.beginPath();
    ctx.moveTo(x0, y - w0 / 2); ctx.lineTo(tipX, y - w1 / 2 - lift);
    ctx.lineTo(tipX, y + w1 / 2 - lift); ctx.lineTo(x0, y + w0 / 2); ctx.fill();
    // Ein heller Funke an der Spitze, solange sie schwingt
    if (f > 0.05) {
      ctx.fillStyle = `rgba(255,236,190,${0.8 * f})`;
      ctx.beginPath(); ctx.arc(tipX, y - lift, w1 * 0.6, 0, 7); ctx.fill();
    }
  }
  // Die Platte, aus der die Zähne wachsen, schräg wie die Wurzeln
  const pg = ctx.createLinearGradient(rootX(0) - back, 0, rootX(TONES - 1), 0);
  pg.addColorStop(0, '#7d7a72'); pg.addColorStop(0.6, '#a9a597'); pg.addColorStop(1, '#8b877b');
  ctx.fillStyle = pg; ctx.beginPath();
  ctx.moveTo(rootX(TONES - 1) - back, yTop); ctx.lineTo(rootX(TONES - 1) + 1, yTop);
  ctx.lineTo(rootX(0) + 1, yBot); ctx.lineTo(rootX(0) - back, yBot); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#4d4a43'; ctx.lineWidth = 1; ctx.stroke();
  // Zwei Schrauben
  for (const k of [0.2, 0.8]) {
    const sy = yTop + (yBot - yTop) * k, sx = rootX(TONES - 1) + (rootX(0) - rootX(TONES - 1)) * k - back * 0.5;
    const sr = Math.max(2.5, back * 0.16);
    ctx.fillStyle = '#5a554b'; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill();
    ctx.fillStyle = '#c7c2b3'; ctx.beginPath(); ctx.arc(sx - sr * 0.15, sy - sr * 0.15, sr * 0.75, 0, 7); ctx.fill();
    ctx.strokeStyle = '#4d4a43'; ctx.lineWidth = Math.max(1, sr * 0.25);
    ctx.beginPath(); ctx.moveTo(sx - sr * 0.6, sy + sr * 0.3); ctx.lineTo(sx + sr * 0.6, sy - sr * 0.3); ctx.stroke();
  }
  // Nabe
  ctx.fillStyle = '#c9a35f'; ctx.beginPath(); ctx.arc(cx, cy, r0 * 0.18, 0, 7); ctx.fill();
}

let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
  if (running) phase = (phase + dt * tempo) % STEPS;
  // Der Stift, der gerade die Zungenspitzen erreicht hat (2026-11-20: vorher
  // floor(phase + 0.5), das riss jeden Stift einen halben Schritt zu früh an)
  const cur = Math.floor(phase) % STEPS;
  if (running && cur !== last) {
    last = cur;
    for (let t = 0; t < TONES; t++) if (pins[cur][t]) { zupf(FREQ[t]); flash[t] = 1; }
  }
  for (let t = 0; t < TONES; t++) flash[t] *= 0.9;
  draw(); drawHover();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Welches Loch liegt unter dem Zeiger? (null außerhalb der Scheibe)
function holeAt(px, py) {
  const dx = px - cx, dy = py - cy, d = Math.hypot(dx, dy);
  if (d < r0 || d > R) return null;
  const t = Math.min(TONES - 1, Math.floor((d - r0) / (R - r0) * TONES));
  const a = Math.atan2(dy, dx) + Math.PI / 2;
  const s = ((Math.round(a * STEPS / (2 * Math.PI) + phase) % STEPS) + STEPS) % STEPS;
  return { s, t };
}
// Mit der Maus zeigt ein schwacher Ring, welches Loch ein Klick trifft (2026-11-20)
let pointer = null;
cv.addEventListener('pointermove', e => { pointer = e.pointerType === 'mouse' ? { x: e.clientX, y: e.clientY } : null; });
cv.addEventListener('pointerleave', () => { pointer = null; });
function drawHover() {
  const h = pointer && holeAt(pointer.x, pointer.y);
  if (!h) return;
  const a = stepA(h.s), r = ringR(h.t), dot = (R - r0) / TONES * 0.28;
  ctx.strokeStyle = 'rgba(233,211,166,0.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, dot * 1.5, 0, 7); ctx.stroke();
}

cv.addEventListener('pointerdown', e => {
  audio();
  const h = holeAt(e.clientX, e.clientY);
  if (!h) return;
  const { s, t } = h;
  pins[s][t] = !pins[s][t];
  if (pins[s][t]) { zupf(FREQ[t]); flash[t] = 1; }
  merken();
});
const haltBtn = document.getElementById('halt');
function halt() { audio(); running = !running; haltBtn.textContent = running ? 'Anhalten' : 'Weiter'; }
haltBtn.onclick = halt;
document.getElementById('leer').onclick = () => { audio(); leer(); merken(); };
document.getElementById('neu').onclick = () => { audio(); meine(); merken(); };
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); halt(); } });
</script>
</body>
</html>
