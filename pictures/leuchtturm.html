<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leuchtturm</title>
<link rel="icon" href="face/baum-nah.png">
<style>
  html, body { margin: 0; height: 100%; background: #0b1220; overflow: hidden; }
  body { font: 15px/1.4 Georgia, "Times New Roman", serif; color: #d8d2c4; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: manipulation; }
  #hud { position: fixed; left: 0; right: 0; top: 10px; text-align: center; pointer-events: none;
         text-shadow: 0 1px 3px #000; }
  #hud small { color: #8b93a3; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="msg"></span><br><small id="sub"></small></div>
<script>
// Leuchtturm: Spiegel drehen, bis der Lichtstrahl jedes Boot erreicht.
// Jede Karte wird erzeugt, indem ein Strahl erst einen Weg legt; dann werden die Spiegel verdreht.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const msg = document.getElementById('msg'), sub = document.getElementById('sub');
let N = 7, par = 0;
let level = 1, moves = 0, won = false, grid, ships, lamps, beam, t0 = performance.now();
let W, H, cell, ox, oy, audio = null;
const TWO = 8;   // ab dieser Nacht steht ein zweiter Leuchtturm am oberen Rand (2026-11-21)

function rnd(n) { return Math.floor(Math.random() * n); }
function reflect(m, dr, dc) { return m === '/' ? [-dc, -dr] : [dc, dr]; }

// einen Strahl verfolgen: besuchte Zellen, Polylinie, und der Fels, an dem er endet (oder -1)
function trace1(L) {
  let r = L.r, c = L.c, dr = L.dr, dc = L.dc;
  const pts = [[r, c]], seen = new Set();
  for (let i = 0; i < 400; i++) {
    r += dr; c += dc;
    if (r < 0 || r >= N || c < 0 || c >= N) { pts.push([r, c]); break; }
    seen.add(r * N + c);
    const m = grid[r][c];
    if (m && m.rock) { pts.push([r, c]); return { pts, seen, rock: r * N + c }; }
    if (m) { [dr, dc] = reflect(m.o, dr, dc); pts.push([r, c]); }
  }
  return { pts, seen, rock: -1 };
}
// alle Strahlen; ein Boot ist im Licht, wenn irgendeiner es erreicht
function trace() {
  const list = lamps.map(trace1), seen = new Set();
  for (const b of list) for (const k of b.seen) seen.add(k);
  return { list, seen };
}

// einen Weg legen: neue Spiegel nur auf Zellen, die frisch sind und nicht in `avoid` liegen
function lay(L, avoid) {
  let r = L.r, c = L.c, dr = L.dr, dc = L.dc;
  const path = [];
  let mirrors = 0;
  while (true) {
    r += dr; c += dc;
    if (r < 0 || r >= N || c < 0 || c >= N) return { path, mirrors, cut: false };
    if (path.length > 60) return { path, mirrors, cut: true };
    const m = grid[r][c];
    if (m) { [dr, dc] = reflect(m.o, dr, dc); path.push(r * N + c); continue; }
    const fresh = !path.includes(r * N + c) && !avoid.has(r * N + c);
    if (fresh && path.length > 0 && Math.random() < 0.38) {
      const o = Math.random() < .5 ? '/' : '\\';
      grid[r][c] = { o, sol: o, rot: 0 };
      mirrors++;
      [dr, dc] = reflect(o, dr, dc);
    }
    path.push(r * N + c);
  }
}

function generate() {
  for (let tries = 0; tries < 500; tries++) {
    grid = Array.from({ length: N }, () => Array(N).fill(null));
    lamps = [{ r: rnd(N), c: -1, dr: 0, dc: 1 }];
    const a = lay(lamps[0], new Set());
    let path = a.path, mirrors = a.mirrors, cut = a.cut, only2 = [];
    if (level >= TWO && !cut) {
      lamps.push({ r: -1, c: rnd(N), dr: 1, dc: 0 });
      const b = lay(lamps[1], new Set(path));
      cut = b.cut; mirrors += b.mirrors;
      only2 = [...new Set(b.path)].filter(k => !path.includes(k) && !grid[Math.floor(k / N)][k % N]);
      path = path.concat(b.path);
    }
    const empty = [...new Set(path)].filter(k => !grid[Math.floor(k / N)][k % N]);
    const want = Math.min(2 + level, 4 + N - 7 + 2);
    const needMirrors = Math.min(3 + level, N + 1) - (tries > 300 ? 2 : 0);
    if (cut || mirrors < needMirrors || empty.length < want + 2) continue;
    // der zweite Turm muss gebraucht werden: ein Drittel der Boote liegt nur in seinem Licht
    const need2 = lamps.length > 1 ? Math.ceil(want / 3) : 0;
    if (need2 && only2.length < need2 + 1) continue;
    // Boote auf dem Weg verteilen
    ships = [];
    const pool2 = only2.slice();
    while (ships.length < need2) ships.push(pool2.splice(rnd(pool2.length), 1)[0]);
    const pool = empty.filter(k => !ships.includes(k));
    while (ships.length < want) ships.push(pool.splice(rnd(pool.length), 1)[0]);
    // Lockspiegel abseits des Weges
    const free = [];
    for (let k = 0; k < N * N; k++) if (!path.includes(k)) free.push(k);
    for (let i = 0; i < Math.min(1 + level, 6) && free.length; i++) {
      const k = free.splice(rnd(free.length), 1)[0];
      const o = Math.random() < .5 ? '/' : '\\';
      grid[Math.floor(k / N)][k % N] = { o, sol: null, rot: 0 };
    }
    // Felsen (ab Nacht 3, Idee aus dem alten Log, 2026-11-21): liegen nie auf dem Weg, aber gern
    // gleich daneben, so endet ein falsch gedrehter Strahl sichtbar am Stein.
    if (level >= 3) {
      const near = free.filter(k => !grid[Math.floor(k / N)][k % N] &&
        [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => {
          const r2 = Math.floor(k / N) + a, c2 = k % N + b;
          return r2 >= 0 && r2 < N && c2 >= 0 && c2 < N && path.includes(r2 * N + c2);
        }));
      for (let i = 0; i < Math.min(level - 1, 6) && near.length; i++) {
        const k = near.splice(rnd(near.length), 1)[0];
        grid[Math.floor(k / N)][k % N] = { rock: true, seed: Math.random() * 6 };
      }
    }
    // gezielt verdrehen: genau `par` Spiegel auf dem Weg stehen falsch, so wächst die Schwierigkeit
    // mit jeder Nacht statt vom Zufall abzuhängen. Lockspiegel stehen beliebig.
    const onPath = [];
    for (const row of grid) for (const m of row) if (m) {
      if (m.rock) continue;
      if (m.sol) onPath.push(m); else if (Math.random() < .5) m.o = m.o === '/' ? '\\' : '/';
    }
    par = Math.min(1 + level, onPath.length);
    onPath.sort(() => Math.random() - .5).slice(0, par).forEach(m => m.o = m.o === '/' ? '\\' : '/');
    beam = trace();
    if (solved()) continue;
    par = fewest(par);
    return;
  }
}

// Der Wärter zählt ehrlich: die kleinste Zahl von Drehungen, die alle Boote ins Licht bringt
// (nicht nur die Zahl der verdrehten Spiegel; es kann einen kürzeren Weg geben). 2026-11-21.
// Eine kürzeste Lösung dreht nur Spiegel, die am Ende im Strahl liegen, und man kann sie in
// Strahlrichtung drehen: dann liegt jeder gerade im Strahl, und alles davor bleibt, wie es ist.
// Bei zwei Türmen: erst den ersten Strahl so, dann den zweiten, ohne Spiegel im ersten anzufassen.
let budget = 0;
function fewest(limit) {
  const flip = m => { m.o = m.o === '/' ? '\\' : '/'; };
  const mirrorsOn = b => b.pts.map(([r, c]) => grid[r] && grid[r][c]).filter(m => m && !m.rock);
  function dfs(k, phase, from) {    // from: wie viele Spiegel im Strahl `phase` schon fest sind
    if (--budget < 0) return false;
    beam = trace();
    if (solved()) return true;
    if (k === 0) return false;
    const list = beam.list;
    for (let p = phase; p < list.length; p++) {
      const fixed = new Set();
      for (let q = 0; q < p; q++) mirrorsOn(list[q]).forEach(m => fixed.add(m));
      const ms = mirrorsOn(list[p]);
      for (let i = p === phase ? from : 0; i < ms.length; i++) {
        if (fixed.has(ms[i])) continue;
        flip(ms[i]); const ok = dfs(k - 1, p, i + 1); flip(ms[i]);
        if (ok) return true;
      }
    }
    return false;
  }
  budget = 200000;
  let best = limit;
  for (let k = 1; k < limit; k++) if (dfs(k, 0, 0)) { best = k; break; }
  beam = trace();
  return best;
}

function solved() { return ships.every(k => beam.seen.has(k)); }

function newLevel() {
  try { localStorage.setItem('leuchtturm-nacht', level); } catch (_) {}
  N = level <= 5 ? 7 : level <= 10 ? 8 : 9;
  generate(); resize(); beam = trace(); moves = 0; won = false; hud();
}

function hud() {
  const lit = ships.filter(k => beam.seen.has(k)).length;
  if (won) {
    msg.textContent = `Alle Boote sehen das Licht. ${moves} ${moves === 1 ? 'Zug' : 'Züge'}` +
      (moves <= par ? ', so gut wie der Wärter.' : ` (der Wärter brauchte ${par}).`);
    sub.textContent = 'Klick für die nächste Nacht';
  } else {
    msg.textContent = `Nacht ${level} · ${lit} von ${ships.length} Booten im Licht`;
    sub.textContent = `Spiegel anklicken zum Drehen · der Wärter schafft es in ${par}`;
  }
}

function resize() {
  const d = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  const top = lamps && lamps.length > 1 ? 1.1 : 0;   // Platz für den Turm über dem Raster
  cell = Math.floor(Math.min((W - 40) / (N + 1.4), (H - 90) / (N + top)));
  cell = Math.max(cell, 18);
  ox = Math.round((W - cell * N) / 2 + cell * .55);
  oy = Math.round((H - cell * (N + top)) / 2 + 22 + cell * top);
}

function lampAt(L) { return L.c === -1 ? [ox - cell * .55, cy(L.r)] : [cx(L.c), oy - cell * .55]; }
function cx(c) { return ox + (c + .5) * cell; }
function cy(r) { return oy + (r + .5) * cell; }

// Töne: kleine Glocken, D-Dur-Pentatonik wie beim Regen
const notes = [293.66, 329.63, 369.99, 440, 493.88, 587.33, 659.25];
function bell(f, when = 0, vol = .12) {
  if (!audio) return;
  const t = audio.currentTime + when, o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + 1.6);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 1.7);
}

function drawBoat(x, y, s, lit, time) {
  const bob = Math.sin(time / 600 + x) * s * .04;
  ctx.save(); ctx.translate(x, y + bob);
  if (lit) {
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s * .6);
    g.addColorStop(0, 'rgba(255,214,120,.35)'); g.addColorStop(1, 'rgba(255,214,120,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, s * .6, 0, 7); ctx.fill();
  }
  ctx.fillStyle = lit ? '#e9c27a' : '#3a4558';
  ctx.beginPath(); // Rumpf
  ctx.moveTo(-s * .3, s * .08); ctx.lineTo(s * .3, s * .08); ctx.lineTo(s * .2, s * .2); ctx.lineTo(-s * .2, s * .2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = lit ? '#fbeedd' : '#4c5870';
  ctx.beginPath(); // Segel
  ctx.moveTo(-s * .02, s * .04); ctx.lineTo(-s * .02, -s * .28); ctx.lineTo(s * .2, s * .04); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawRock(x, y, s, hit, time, seed) {
  ctx.save(); ctx.translate(x, y);
  // Brandung: ein heller Saum um den Fuß, der langsam atmet
  const sw = .5 + .5 * Math.sin(time / 700 + seed);
  ctx.strokeStyle = 'rgba(200,215,230,' + (.12 + .12 * sw) + ')'; ctx.lineWidth = Math.max(1, s * .03);
  ctx.beginPath(); ctx.ellipse(0, s * .14, s * (.36 + .03 * sw), s * .12, 0, 0, 7); ctx.stroke();
  // Stein: zwei, drei Buckel, unten von der Wasserlinie abgeschnitten
  const outline = [];
  for (let i = 0; i <= 12; i++) {
    const a = Math.PI + i / 12 * Math.PI;
    const rr = s * (.27 + .06 * Math.sin(seed * 3 + i * 1.3) + .03 * Math.sin(seed * 7 + i * 2.9));
    outline.push([Math.cos(a) * rr * 1.1, Math.sin(a) * rr * 1.25 + s * .14]);
  }
  ctx.beginPath(); outline.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)); ctx.closePath();
  ctx.fillStyle = '#39424f'; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(hit && hit[0] > 0 ? -s * .52 : s * .02, -s * .5, s * .5, s);   // Schattenseite, weg vom Strahl
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = Math.max(1, s * .02);     // ein Riss
  ctx.beginPath(); ctx.moveTo(-s * .05 + seed * .01 * s, -s * .12); ctx.lineTo(s * .02, s * .0); ctx.lineTo(-s * .03, s * .13); ctx.stroke();
  if (hit) {   // die vom Licht getroffene Seite; hit = Richtung, aus der das Licht kommt
    const gx = hit[0] * s * .2, gy = s * .02 + hit[1] * s * .14;
    const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, s * .34);
    g.addColorStop(0, 'rgba(255,214,140,.6)'); g.addColorStop(1, 'rgba(255,214,140,0)');
    ctx.fillStyle = g; ctx.fillRect(-s * .5, -s * .5, s, s);
  }
  ctx.restore();
  // Mondlicht auf der oberen Kante, nur die linke Hälfte
  ctx.strokeStyle = 'rgba(190,205,225,.45)'; ctx.lineWidth = Math.max(1, s * .02);
  ctx.beginPath(); outline.slice(1, 7).forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)); ctx.stroke();
  ctx.fillStyle = 'rgba(160,180,200,.35)'; ctx.fillRect(-s * .32, s * .13, s * .64, Math.max(1, s * .025));  // Wasserlinie
  ctx.restore();
}

function draw(time) {
  ctx.fillStyle = '#0b1220'; ctx.fillRect(0, 0, W, H);
  // Sterne
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 60; i++) {
    const x = (i * 97.3) % W, y = (i * 53.7) % (H * .9);
    ctx.globalAlpha = .15 + .15 * Math.sin(time / 900 + i); ctx.fillRect(x, y, 1.2, 1.2);
  }
  ctx.globalAlpha = 1;
  // Wasserraster
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const lit = beam.seen.has(r * N + c);
    ctx.fillStyle = lit ? 'rgba(80,110,150,.22)' : 'rgba(40,60,90,.18)';
    ctx.fillRect(ox + c * cell + 1, oy + r * cell + 1, cell - 2, cell - 2);
  }
  // Leuchttürme: links am Rand, ab Nacht TWO ein zweiter oben
  const pulse = .75 + .25 * Math.sin(time / 400);
  lamps.forEach((L, li) => {   // erst die Strahlen, dann die Türme darüber (der obere Strahl läuft sonst über den Turm)
    const [lx, ly] = lampAt(L);
    const b = beam.list[li];
    const p = b.pts.map(([r, c]) => [cx(c), cy(r)]);
    p[0] = [lx, ly - cell * .02];
    const last = b.pts[b.pts.length - 1];
    p[p.length - 1] = [cx(Math.max(-0.5, Math.min(N - .5, last[1]))), cy(Math.max(-0.5, Math.min(N - .5, last[0])))];
    if (b.rock >= 0 && p.length > 1) {   // am Stein enden, nicht in seiner Mitte
      const [x0, y0] = p[p.length - 2], [x1, y1] = p[p.length - 1], d = Math.hypot(x1 - x0, y1 - y0) || 1;
      p[p.length - 1] = [x1 - (x1 - x0) / d * cell * .24, y1 - (y1 - y0) / d * cell * .24];
    }
    for (const [w, a] of [[cell * .28, .08], [cell * .12, .18], [2.2, .9]]) {
      ctx.strokeStyle = 'rgba(255,220,140,' + a * pulse + ')'; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); p.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    }
  });
  for (const L of lamps) {
    const [lx, ly] = lampAt(L);
    // Fuß: ein flacher Fels mit Brandung, sonst schwebt der Turm
    ctx.fillStyle = '#2b333e';
    ctx.beginPath(); ctx.ellipse(lx, ly + cell * .47, cell * .26, cell * .08, 0, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = 'rgba(200,215,230,' + (.15 + .1 * Math.sin(time / 700 + lx)) + ')'; ctx.lineWidth = Math.max(1, cell * .025);
    ctx.beginPath(); ctx.ellipse(lx, ly + cell * .48, cell * .3, cell * .06, 0, 0, 7); ctx.stroke();
    ctx.fillStyle = '#c9c1b2';
    ctx.beginPath(); ctx.moveTo(lx - cell * .16, ly + cell * .45); ctx.lineTo(lx + cell * .16, ly + cell * .45);
    ctx.lineTo(lx + cell * .1, ly - cell * .1); ctx.lineTo(lx - cell * .1, ly - cell * .1); ctx.fill();
    ctx.fillStyle = '#a3503a'; ctx.fillRect(lx - cell * .14, ly + cell * .15, cell * .28, cell * .08);
    ctx.fillStyle = '#ffe2a0'; ctx.beginPath(); ctx.arc(lx, ly - cell * .02, cell * .09, 0, 7); ctx.fill();
  }
  // Boote
  for (const k of ships) drawBoat(cx(k % N), cy(Math.floor(k / N)), cell, beam.seen.has(k), time);
  // Spiegel
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const m = grid[r][c]; if (!m) continue;
    if (m.rock) {
      let hit = null;
      for (const b of beam.list) if (b.rock === r * N + c) {
        const [pr, pc] = b.pts[b.pts.length - 2];
        hit = [Math.sign(pc - c), Math.sign(pr - r)];
      }
      drawRock(cx(c), cy(r), cell, hit, time, m.seed); continue;
    }
    const target = m.o === '/' ? -Math.PI / 4 : Math.PI / 4;
    m.rot += (target - m.rot) * .25;
    ctx.save(); ctx.translate(cx(c), cy(r)); ctx.rotate(m.rot);
    ctx.fillStyle = '#9fb3c8'; ctx.fillRect(-cell * .38, -cell * .045, cell * .76, cell * .09);
    ctx.fillStyle = '#e8f1fa'; ctx.fillRect(-cell * .38, -cell * .045, cell * .76, cell * .03);
    ctx.restore();
  }
  requestAnimationFrame(draw);
}

cv.addEventListener('pointerdown', e => {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
  if (won) { level++; newLevel(); return; }
  const c = Math.floor((e.clientX - ox) / cell), r = Math.floor((e.clientY - oy) / cell);
  if (r < 0 || r >= N || c < 0 || c >= N || !grid[r][c] || grid[r][c].rock) return;
  const rocksOf = () => beam.list.map(b => b.rock).filter(k => k >= 0);
  const before = ships.filter(k => beam.seen.has(k)).length, rocksBefore = rocksOf();
  const m = grid[r][c]; m.o = m.o === '/' ? '\\' : '/';
  moves++; beam = trace();
  const after = ships.filter(k => beam.seen.has(k)).length;
  if (after > before) bell(notes[Math.min(after, notes.length - 1)]);
  else if (rocksOf().some(k => !rocksBefore.includes(k))) bell(notes[0] / 2, 0, .07);   // dumpf: Licht am Stein
  if (solved()) { won = true; [0, 2, 4, 6].forEach((n, i) => bell(notes[n], i * .12, .1)); }
  hud();
});

addEventListener('resize', resize);
try { level = Math.max(1, parseInt(localStorage.getItem('leuchtturm-nacht')) || 1); } catch (_) {}
resize(); newLevel(); requestAnimationFrame(draw);
</script>
</body>
</html>
